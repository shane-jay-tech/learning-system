- id: debug_log_good
  problem_id: "agent_10_01"
  lang: agent_dev
  answer: |
    **问题定位**：从日志第 3 行可以看出 KeyError: 'department'，说明 CSV 列名不匹配。
    **根因**：代码用 row['department'] 取值，但实际 CSV 表头是 'dept'。
    **修复方案**：改为 row['dept'] 或在读取后做列名映射 rename。
    **验证方法**：修改后重新运行，观察输出是否包含所有部门的统计结果。
  expected:
    score_min: 75
    score_max: 100
    passed: true
    dimensions_min: 2

