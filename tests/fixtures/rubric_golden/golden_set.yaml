# Used to verify prompt changes don't cause scoring drift.

- id: agent_spec_complete
  problem_id: "agent_07_01"
  lang: agent_dev
  answer: |
    **目标**：写一个 Python 脚本，从 data.csv 读取数据，计算每部门平均薪资，输出到 result.csv。
    **边界条件**：Python 3.8+，不用外部库（仅 csv 模块），CSV 编码 UTF-8。
    **验收标准**：输入 3 行测试数据时输出正确；空文件时输出表头但无数据行；中文部门名正常处理。
  expected:
    score_min: 75
    score_max: 95
    passed: true
    dimensions_min: 2
  must_mention:
    - 边界
    - 验收

