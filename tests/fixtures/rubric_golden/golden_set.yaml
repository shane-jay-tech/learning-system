- id: cfa_good
  problem_id: "r_15_01"
  lang: r
  answer: |
    CFA 语法：exhaustion =~ e1 + e2 + e3 + e4，用 =~ 定义潜变量和指标的关系。
    拟合 cfa(model, data)，看标准化载荷是否>0.4，CFI>0.90。
    与 EFA 区别：CFA 验证已有理论结构，EFA 探索未知结构。
  expected:
    score_min: 65
    score_max: 90
    passed: true
    dimensions_min: 2

