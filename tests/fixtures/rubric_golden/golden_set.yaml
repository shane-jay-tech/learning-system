- id: python_explain_recursion
  problem_id: "python_08_01"
  lang: python
  answer: |
    递归就是函数调用自己。必须有终止条件，否则无限循环。
    比如算阶乘：factorial(n) = n * factorial(n-1)，终止条件是 n==1 返回 1。
  expected:
    score_min: 55
    score_max: 85
    passed: true
    dimensions_min: 1

