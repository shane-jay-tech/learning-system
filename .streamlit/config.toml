# Streamlit 配置 — 桌面 app 模式优化

[client]
# 隐藏顶部 deploy 按钮、汉堡菜单（让它更像 app 而不是网页）
toolbarMode = "minimal"
# 显示详细错误（调试需要）
showErrorDetails = true
showSidebarNavigation = true

[server]
headless = true
fileWatcherType = "none"
runOnSave = false
# enableCORS / enableXsrfProtection 保留默认（本地 webview 无需调整）

[browser]
gatherUsageStats = false

[theme]
# 主题色和我们 CSS 变量保持一致（indigo）
primaryColor = "#6366F1"
backgroundColor = "#F8FAFC"
secondaryBackgroundColor = "#FFFFFF"
textColor = "#0F172A"
font = "sans serif"

[ui]
hideTopBar = false
