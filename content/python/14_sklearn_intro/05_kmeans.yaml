title: "KMeans 聚类"
topic: "14_sklearn_intro"
difficulty: 3
tags: ["sklearn", "kmeans"]
statement: |
  6 个员工的 [年龄, 工资]：
  ```
  [[22,4000], [25,4500], [23,4200],
   [40,12000], [42,13000], [45,12500]]
  ```
  用 `KMeans(n_clusters=2, random_state=42, n_init=10)` 聚类，输出每个样本的 cluster label，**用空格分开在一行**。

  应该是 `0 0 0 1 1 1` 或 `1 1 1 0 0 0`（label 顺序看初始化）。题目固定 random_state=42 + n_init=10，保证输出 `1 1 1 0 0 0`。
starter_code: |
  from sklearn.cluster import KMeans
  import numpy as np

  X = np.array([[22,4000],[25,4500],[23,4200],[40,12000],[42,13000],[45,12500]])
  # KMeans(n_clusters=2, random_state=42, n_init=10)，输出 labels_

expected_output: |
  0 0 0 1 1 1
hints:
  - "km = KMeans(n_clusters=2, random_state=42, n_init=10).fit(X)"
  - "print(' '.join(str(x) for x in km.labels_))"
  - "n_init=10 是新版 sklearn 默认；显式写明避免警告"
