title: "多元回归与 OLS 摘要表"
topic: "22_statsmodels"
difficulty: 3
tags: ["statsmodels", "ols", "regression"]
judge_mode: ai_open
statement: |
  用 statsmodels 进行多元线性回归并输出 OLS 摘要表。

  步骤：
  1. 读取 research_data.csv
  2. 用 sm.add_constant 构造 X（变量：hours, iq, gpa）
  3. 目标 y：income
  4. 拟合 OLS 模型并输出完整摘要表
  5. 判断 hours 的 p 值是否 < 0.05，输出 True 或 False

  提交完整代码。
starter_code: |
  import pandas as pd
  import statsmodels.api as sm
rubric:
  - "正确读取 research_data.csv 并用 sm.add_constant 构造含截距的 X"
  - "OLS 拟合 income ~ hours + iq + gpa，输出完整摘要表（model.summary()）"
  - "正确取出 hours 的 p 值并与 0.05 比较，输出 True/False 布尔值"
reference_answer: |
  import pandas as pd
  import statsmodels.api as sm

  df = pd.read_csv("content/datasets/research_data.csv")
  X = sm.add_constant(df[["hours", "iq", "gpa"]])
  y = df["income"]
  model = sm.OLS(y, X).fit()
  print(model.summary())
  print(bool(model.pvalues["hours"] < 0.05))
hints:
  - "sm.add_constant(df[[\"hours\", \"iq\", \"gpa\"]]) 先加截距列，再 sm.OLS(y, X).fit()"
  - "model.summary() 直接打印完整 OLS 摘要表"
  - "hours 的 p 值取 model.pvalues[\"hours\"]，与 0.05 比较后用 print() 输出 True/False"
