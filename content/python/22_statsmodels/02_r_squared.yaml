title: "解释 R² 值"
topic: "22_statsmodels"
difficulty: 2
tags: ["statsmodels", "r-squared"]
statement: |
  用 statsmodels 对以下数据拟合线性回归并输出 R² 值（保留 4 位小数）：

  - X: [1, 2, 3, 4, 5, 6, 7, 8]
  - y: [2.1, 3.9, 6.2, 7.8, 10.1, 12.0, 13.9, 16.1]

  输出格式：`R² = X.XXXX`
starter_code: |
  import numpy as np
  import statsmodels.api as sm

  X = np.array([1, 2, 3, 4, 5, 6, 7, 8])
  y = np.array([2.1, 3.9, 6.2, 7.8, 10.1, 12.0, 13.9, 16.1])

  # 拟合并输出 R²
expected_output: |
  R² = 0.9994
hints:
  - "model.rsquared 获取 R² 值"
  - "f'{model.rsquared:.4f}' 保留 4 位小数"
