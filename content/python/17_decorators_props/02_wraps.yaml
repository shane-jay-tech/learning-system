title: "保留函数名（functools.wraps）"
topic: "17_decorators_props"
difficulty: 2
tags: ["decorator", "wraps"]
statement: |
  用 `@functools.wraps(func)` 保护被装饰函数的 `__name__`。
  `square` 被 `simple_log` 装饰后，输出 `square.__name__` 应该是 `square`（不是 `wrapper`）。
starter_code: |
  import functools

  def simple_log(func):
      @functools.wraps(func)
      def wrapper(*args, **kwargs):
          return func(*args, **kwargs)
      return wrapper

  @simple_log
  def square(n):
      """compute square"""
      return n * n

  print(square.__name__)
expected_output: |
  square
hints:
  - "@functools.wraps(func) 必须加在 wrapper 定义之上"
  - "不加的话 __name__ 是 'wrapper'"
  - "wraps 还会保留 __doc__"
