title: "Counter 词频 Top-3"
topic: "15_ab_text"
difficulty: 1
tags: ["counter", "text"]
statement: |
  文本 `text = "the quick brown fox jumps over the lazy dog the fox"`
  请用 `Counter` 输出**出现次数最多的 3 个**单词，每行 `单词 次数`。

  期望：
  ```
  the 3
  fox 2
  quick 1
  ```
starter_code: |
  from collections import Counter

  text = "the quick brown fox jumps over the lazy dog the fox"
  # words 转小写 split 后用 Counter，most_common(3)，每行打印

expected_output: |
  the 3
  fox 2
  quick 1
hints:
  - "words = text.lower().split()"
  - "for w, n in Counter(words).most_common(3): print(w, n)"
  - "most_common 自动按次数降序"
