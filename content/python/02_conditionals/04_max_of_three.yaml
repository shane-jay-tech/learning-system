title: "三数取最大值"
topic: "02_conditionals"
difficulty: 2
tags: ["conditionals", "comparison"]
statement: |
  读入三个整数（每行一个），输出其中最大的那个。
starter_code: |
  a = int(input())
  b = int(input())
  c = int(input())

  # 判断并输出最大值
tests:
  - stdin: "3\n7\n5\n"
    expected_output: "7\n"
  - stdin: "-1\n-5\n-3\n"
    expected_output: "-1\n"
  - stdin: "4\n4\n4\n"
    expected_output: "4\n"
  - stdin: "9\n1\n5\n"
    expected_output: "9\n"
hints:
  - "可以两两比较：先比 a 和 b，再把大的跟 c 比"
  - "也可以用 max(a, b, c) 一行搞定"
