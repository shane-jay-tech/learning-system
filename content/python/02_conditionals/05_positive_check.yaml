title: "判断正数、负数还是零"
topic: "02_conditionals"
difficulty: 1
tags: ["conditionals", "sign"]
statement: |
  读入一个整数，如果是正数输出 `positive`，
  负数输出 `negative`，零输出 `zero`。
starter_code: |
  n = int(input())

  # 判断并输出
tests:
  - stdin: "5\n"
    expected_output: "positive\n"
  - stdin: "-3\n"
    expected_output: "negative\n"
  - stdin: "0\n"
    expected_output: "zero\n"
hints:
  - "用 if / elif / else 三分支"
  - "判断条件：n > 0, n < 0, n == 0"
