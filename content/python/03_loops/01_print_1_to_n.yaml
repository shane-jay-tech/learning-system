title: "输出 1 到 N"
topic: "03_loops"
difficulty: 1
tags: ["for", "range"]
statement: |
  从标准输入读一个正整数 `N`，把 1, 2, 3, ..., N **每行一个** 全部输出。

  例如输入 `5`，应输出：
  ```
  1
  2
  3
  4
  5
  ```
starter_code: |
  n = int(input())
  # 用 for 循环逐行输出 1 到 n

expected_output: |
  1
  2
  3
  4
  5
tests:
  - stdin: "5\n"
    expected_output: "1\n2\n3\n4\n5\n"
hints:
  - "用 for i in range(1, n+1):"
  - "注意 range 是左闭右开，要写 n+1"
  - "默认 print(i) 自带换行"
