title: "super 调用父类"
topic: "16_classes_oop"
difficulty: 3
tags: ["super", "inheritance"]
statement: |
  父类 `Employee` 有 `name` 和 `salary`。
  请定义 `Manager(Employee)`，`__init__` 多接收一个 `team` 参数；用 `super().__init__()` 初始化 name/salary，然后存 self.team。

  从输入读 `name salary team`（空格分隔），创建 Manager 后输出 `<name> <salary> <team>`。

  输入 `Alice 50000 Sales`，输出 `Alice 50000 Sales`。
starter_code: |
  class Employee:
      def __init__(self, name, salary):
          self.name = name
          self.salary = salary

  class Manager(Employee):
      def __init__(self, name, salary, team):
          # 用 super().__init__() 初始化父类部分
          # 再设置 self.team
          pass

  parts = input().split()
  m = Manager(parts[0], int(parts[1]), parts[2])
  print(m.name, m.salary, m.team)
expected_output: |
  Alice 50000 Sales
tests:
  - stdin: "Alice 50000 Sales\n"
    expected_output: "Alice 50000 Sales\n"
hints:
  - "super().__init__(name, salary)"
  - "然后 self.team = team"
  - "不写 super 会丢 name/salary 的初始化"
