title: "去重后升序排列"
topic: "05_lists"
difficulty: 2
tags: ["list", "set", "sorted"]
statement: |
  从标准输入读一行空格分隔的整数，去掉重复元素后**按升序**用空格分隔输出。

  例如输入 `3 1 4 1 5 9 2 6 5 3`，输出 `1 2 3 4 5 6 9`。
starter_code: |
  nums = [int(x) for x in input().split()]
  # 去重 + 排序 + 空格拼接输出

expected_output: |
  1 2 3 4 5 6 9
tests:
  - stdin: "3 1 4 1 5 9 2 6 5 3\n"
    expected_output: "1 2 3 4 5 6 9\n"
hints:
  - "去重：unique = set(nums)"
  - "排序：sorted(unique) 返回升序列表"
  - "拼接：' '.join(str(x) for x in sorted_list)"
