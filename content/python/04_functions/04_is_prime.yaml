title: "判断质数"
topic: "04_functions"
difficulty: 3
tags: ["def", "loop", "bool"]
statement: |
  请定义一个 `is_prime(n)` 函数：
  - 参数 `n` 是一个正整数
  - 如果 n 是 **质数**（只能被 1 和它自己整除的大于 1 的整数），返回 `True`
  - 否则返回 `False`

  从标准输入读一个整数，调用并输出结果（`True` 或 `False`）。

  例如输入 `7` 输出 `True`；输入 `9` 输出 `False`；输入 `1` 输出 `False`。
starter_code: |
  def is_prime(n):
      if n < 2:
          return False
      # 用 for 循环检查 2 到 n-1 是否能整除 n
      pass

  n = int(input())
  print(is_prime(n))
expected_output: |
  True
tests:
  - stdin: "7\n"
    expected_output: "True\n"
hints:
  - "for i in range(2, n): if n %% i == 0: return False"
  - "循环结束都没 return False，说明是质数 → return True"
  - "注意：1 不是质数；要单独处理 n < 2 的情况（starter 已替你写好）"
