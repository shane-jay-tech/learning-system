title: "用 CTE 算高分学生"
topic: "07_cte"
difficulty: 1
tags: ["cte", "with"]
statement: |
  请用 `WITH ... AS (...)` 定义一个 `high_scorers` CTE 包含 score>=80 的学生，然后从 CTE 选 name。

  期望（按 id 升序）3 行：Alice、Bob、Eve。
starter_code: |
  -- WITH high_scorers AS (SELECT * FROM students WHERE score >= 80)
  -- SELECT name FROM high_scorers ORDER BY id;

setup_sql: |
  CREATE TABLE students (id INTEGER, name TEXT, score INTEGER);
  INSERT INTO students VALUES (1,'Alice',92),(2,'Bob',87),(3,'Cathy',75),(4,'David',60),(5,'Eve',95);
expected_rows:
  - ["Alice"]
  - ["Bob"]
  - ["Eve"]
hints:
  - "WITH high_scorers AS (SELECT * FROM students WHERE score >= 80) SELECT name FROM high_scorers ORDER BY id"
  - "CTE 里可以是任意 SELECT 查询"
  - "CTE 后面跟主查询"
