title: "按月统计入职数"
topic: "10_date_funcs"
difficulty: 3
tags: ["strftime", "group-by", "cohort"]
statement: |
  按 hire_date 的年-月分组，统计每月入职几人。
  按月份升序输出 `年月 人数`。

  期望：2024-01 1, 2024-06 2, 2025-03 1。
starter_code: |
  -- SELECT STRFTIME('%Y-%m', hire_date) AS month, COUNT(*)
  -- FROM employees GROUP BY month ORDER BY month

setup_sql: |
  CREATE TABLE employees (id INTEGER, name TEXT, hire_date TEXT);
  INSERT INTO employees VALUES (1,'Alice','2024-01-15'),(2,'Bob','2024-06-20'),(3,'Cathy','2025-03-10'),(4,'David','2024-06-05');
expected_rows:
  - ["2024-01", 1]
  - ["2024-06", 2]
  - ["2025-03", 1]
hints:
  - "GROUP BY 提取的 %Y-%m"
  - "COUNT(*) 算每组人数"
  - "ORDER BY month 让月份升序"
