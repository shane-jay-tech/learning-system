title: "最近 1 年入职"
topic: "10_date_funcs"
difficulty: 3
tags: ["date", "filter"]
statement: |
  以 `'2026-05-29'` 为参考日期，找**最近 365 天内**入职的员工（hire_date 在 '2025-05-29' 之后或当天）。
  按 hire_date 升序输出 name。

  期望：Cathy（2025-03 不在 365 天内，会被过滤；只有 hire_date >= 2025-05-29 的）

  实际数据：Alice 2024-01-15, Bob 2024-06-20, Cathy 2025-03-10, David 2025-08-01。
  365 天前是 2025-05-29，所以只有 David 满足。
starter_code: |
  -- SELECT name FROM employees
  -- WHERE hire_date >= DATE('2026-05-29', '-365 days')
  -- ORDER BY hire_date

setup_sql: |
  CREATE TABLE employees (id INTEGER, name TEXT, hire_date TEXT);
  INSERT INTO employees VALUES (1,'Alice','2024-01-15'),(2,'Bob','2024-06-20'),(3,'Cathy','2025-03-10'),(4,'David','2025-08-01');
expected_rows:
  - ["David"]
hints:
  - "DATE('2026-05-29', '-365 days') 算出 1 年前的日期"
  - "WHERE hire_date >= ..."
  - "ISO 格式日期可以按字符串大小比较"
