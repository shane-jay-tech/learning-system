title: "条件筛选：分数大于 80"
topic: "01_select_where"
difficulty: 1
tags: ["where", "comparison"]
statement: |
  查询 `students` 表中 `score > 80` 的学生，只返回 `name` 和 `score` 两列。
starter_code: |
  -- SELECT name, score FROM students WHERE ...
setup_sql: |
  CREATE TABLE students (id INTEGER, name TEXT, score INTEGER);
  INSERT INTO students VALUES (1,'Alice',92),(2,'Bob',87),(3,'Cathy',75),(4,'David',60),(5,'Eve',95);
expected_rows:
  - ["Alice", 92]
  - ["Bob", 87]
hints:
  - "WHERE score > 80 负责行过滤"
  - "只取两列：SELECT name, score"
  - "验证时对照 expected_rows：Cathy 75、David 60 应被过滤掉"
