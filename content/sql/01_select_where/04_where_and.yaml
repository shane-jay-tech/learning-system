title: "多条件 AND：分数在 80~95 且名字含字母 a"
topic: "01_select_where"
difficulty: 2
tags: ["where", "and", "like"]
statement: |
  查询 `students` 表中 `score BETWEEN 80 AND 95` 且 `name LIKE '%a%'` 的行，返回所有列。
starter_code: |
  -- SELECT * FROM students WHERE ...
setup_sql: |
  CREATE TABLE students (id INTEGER, name TEXT, score INTEGER);
  INSERT INTO students VALUES (1,'Alice',92),(2,'Bob',87),(3,'Cathy',75),(4,'David',60),(5,'Eve',95);
expected_rows:
  - [1, "Alice", 92]
  - [2, "Bob", 87]
hints:
  - "BETWEEN 80 AND 95 是闭区间（含两端）"
  - "LIKE '%a%' 匹配名字里任意位置含 a 的行"
  - "两个条件用 AND 连接；Cathy 75 不满足 BETWEEN 会被过滤"
