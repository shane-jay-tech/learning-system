title: "NOT EXISTS 找空部门"
topic: "08_exists"
difficulty: 2
tags: ["not-exists"]
statement: |
  用 NOT EXISTS 找出**没有学生**的部门，输出 name。

  期望 1 行：Finance。
starter_code: |
  -- SELECT name FROM departments d
  -- WHERE NOT EXISTS (SELECT 1 FROM students s WHERE s.dept_id = d.id)

setup_sql: |
  CREATE TABLE departments (id INTEGER, name TEXT);
  INSERT INTO departments VALUES (1,'HR'),(2,'Eng'),(3,'Finance');
  CREATE TABLE students (id INTEGER, name TEXT, dept_id INTEGER);
  INSERT INTO students VALUES (1,'Alice',1),(2,'Bob',2);
expected_rows:
  - ["Finance"]
hints:
  - "NOT EXISTS 取反"
  - "比 NOT IN 安全（NULL 不会出问题）"
  - "结果只 1 行不需要 ORDER BY"
