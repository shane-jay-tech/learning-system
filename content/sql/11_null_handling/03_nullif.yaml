title: "NULLIF 防除零"
topic: "11_null_handling"
difficulty: 2
tags: ["nullif"]
statement: |
  对 stats 表算 `total / count`，但 count=0 时不能除——用 `NULLIF(count, 0)` 让结果变 NULL。
  按 id 升序输出 name 和结果。

  期望：Alice 50，Bob NULL（count=0），Cathy 30。
starter_code: |
  -- SELECT name, total / NULLIF(count, 0) FROM stats ORDER BY id

setup_sql: |
  CREATE TABLE stats (id INTEGER, name TEXT, total INTEGER, count INTEGER);
  INSERT INTO stats VALUES (1,'Alice',100,2),(2,'Bob',50,0),(3,'Cathy',90,3);
expected_rows:
  - ["Alice", 50]
  - ["Bob", null]
  - ["Cathy", 30]
hints:
  - "NULLIF(x, y)：x==y 时返回 NULL，否则 x"
  - "和 NULL 做除法 → 结果 NULL（而不是错误）"
  - "经典防除零写法"
