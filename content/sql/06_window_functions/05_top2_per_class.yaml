title: "每班 TOP 2"
topic: "06_window_functions"
difficulty: 3
tags: ["window", "subquery"]
statement: |
  请输出**每个班的前 2 名**学生（按 score 降序）。输出 `class name score`，按 class 升序、班内按 score 降序。

  A 班 3 人取前 2（Eve 95, Alice 92）；B 班 2 人全保留（Bob 87, David 60）。
starter_code: |
  -- 用子查询包窗口结果，外层 WHERE rn <= 2
  -- SELECT class, name, score FROM (
  --   SELECT class, name, score, ROW_NUMBER() OVER (PARTITION BY class ORDER BY score DESC) AS rn FROM students
  -- ) t
  -- WHERE rn <= 2 ORDER BY class, score DESC

setup_sql: |
  CREATE TABLE students (id INTEGER, name TEXT, score INTEGER, class TEXT);
  INSERT INTO students VALUES (1,'Alice',92,'A'),(2,'Bob',87,'B'),(3,'Cathy',75,'A'),(4,'David',60,'B'),(5,'Eve',95,'A');
expected_rows:
  - ["A", "Eve", 95]
  - ["A", "Alice", 92]
  - ["B", "Bob", 87]
  - ["B", "David", 60]
hints:
  - "WHERE 不能直接过滤 ROW_NUMBER 列——必须把窗口查询包成子查询"
  - "外层 WHERE rn <= 2"
  - "派生表别忘了起别名 t"
