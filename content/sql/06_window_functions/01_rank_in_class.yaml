title: "班内排名"
topic: "06_window_functions"
difficulty: 2
tags: ["window", "row-number"]
statement: |
  给每个学生标出"在他班里按 score 降序的排名"，输出 `class name score rn` 四列。
  按 class 升序、班内按 rn 升序排列。
starter_code: |
  -- ROW_NUMBER() OVER (PARTITION BY class ORDER BY score DESC) AS rn

setup_sql: |
  CREATE TABLE students (id INTEGER, name TEXT, score INTEGER, class TEXT);
  INSERT INTO students VALUES (1,'Alice',92,'A'),(2,'Bob',87,'B'),(3,'Cathy',75,'A'),(4,'David',60,'B'),(5,'Eve',95,'A');
expected_rows:
  - ["A", "Eve", 95, 1]
  - ["A", "Alice", 92, 2]
  - ["A", "Cathy", 75, 3]
  - ["B", "Bob", 87, 1]
  - ["B", "David", 60, 2]
hints:
  - "SELECT class, name, score, ROW_NUMBER() OVER (PARTITION BY class ORDER BY score DESC) AS rn FROM students ORDER BY class, rn"
  - "PARTITION BY 把表拆成几个独立窗口"
  - "ORDER BY 在 OVER 里决定窗口内顺序"
