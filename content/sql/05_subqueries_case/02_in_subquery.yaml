title: "IN 子查询"
topic: "05_subqueries_case"
difficulty: 2
tags: ["subquery", "in"]
statement: |
  HR 部门是 dept_id=1。请用 IN 子查询找出**和 HR 部门同部门**的所有学生姓名。

  Alice 和 Cathy 都在 HR，按 id 升序输出。
starter_code: |
  -- WHERE dept_id IN (SELECT id FROM departments WHERE name = 'HR')

setup_sql: |
  CREATE TABLE departments (id INTEGER, name TEXT);
  INSERT INTO departments VALUES (1,'HR'),(2,'Eng');
  CREATE TABLE students (id INTEGER, name TEXT, dept_id INTEGER);
  INSERT INTO students VALUES (1,'Alice',1),(2,'Bob',2),(3,'Cathy',1),(4,'David',NULL),(5,'Eve',2);
expected_rows:
  - ["Alice"]
  - ["Cathy"]
hints:
  - "SELECT name FROM students WHERE dept_id IN (SELECT id FROM departments WHERE name='HR') ORDER BY id"
  - "IN 适合子查询返回一列多行的情况"
  - "用 = 仅当子查询保证只返一行"
