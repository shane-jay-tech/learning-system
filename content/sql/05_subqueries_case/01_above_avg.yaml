title: "高于平均分的学生"
topic: "05_subqueries_case"
difficulty: 2
tags: ["subquery", "where"]
statement: |
  请用子查询，找出 score **高于全班平均分** 的学生姓名（按 id 升序）。

  数据 5 个学生 [92,87,75,60,95]，平均 81.8。高于的：Alice(92), Bob(87), Eve(95)。
starter_code: |
  -- WHERE score > (SELECT AVG(score) FROM students)

setup_sql: |
  CREATE TABLE students (id INTEGER, name TEXT, score INTEGER);
  INSERT INTO students VALUES (1,'Alice',92),(2,'Bob',87),(3,'Cathy',75),(4,'David',60),(5,'Eve',95);
expected_rows:
  - ["Alice"]
  - ["Bob"]
  - ["Eve"]
hints:
  - "SELECT name FROM students WHERE score > (SELECT AVG(score) FROM students) ORDER BY id"
  - "子查询括号别忘"
  - "ORDER BY id 让顺序固定"
