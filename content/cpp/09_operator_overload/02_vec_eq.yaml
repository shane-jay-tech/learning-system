title: "重载 == 比较"
topic: "09_operator_overload"
difficulty: 2
tags: ["operator==", "boolalpha"]
statement: |
  定义 Vec 含 x, y。重载 `==` 让 `Vec(3,4) == Vec(3,4)` 返回 true。
  从输入读 `x1 y1 x2 y2`，输出比较结果（用 boolalpha）。

  输入 `3 4 3 4`，输出 `true`。
starter_code: |
  #include <iostream>
  using namespace std;

  class Vec {
  public:
      int x, y;
      Vec(int x, int y) : x(x), y(y) {}
      // 重载 == 返回 bool
  };

  int main() {
      int x1, y1, x2, y2; cin >> x1 >> y1 >> x2 >> y2;
      cout << boolalpha << (Vec(x1,y1) == Vec(x2,y2)) << endl;
      return 0;
  }
expected_output: |
  true
tests:
  - stdin: "3 4 3 4\n"
    expected_output: "true\n"
hints:
  - "bool operator==(const Vec& o) const { return x == o.x && y == o.y; }"
  - "返回 bool"
  - "boolalpha 让 cout 输出 true/false"
