title: "C++ 的 Hello, World!"
topic: "01_io_and_vars"
difficulty: 1
tags: ["io", "starter"]
statement: |
  请补全下面的程序，让它输出**恰好一行**：
  ```
  Hello, World!
  ```
starter_code: |
  #include <iostream>
  using namespace std;

  int main() {
      // 在下面写一句 cout 输出

      return 0;
  }
expected_output: |
  Hello, World!
hints:
  - "cout << \"...\" << endl; 是输出一行的标准写法"
  - "endl 会自动换行"
  - "字符串用双引号，不要写成单引号"
