title: "count 出现次数"
topic: "06_iter_algo"
difficulty: 1
tags: ["count"]
statement: |
  读 N + N 个整数 + 目标 `x`，输出 x 出现次数。

  输入 `8\n1 3 1 4 1 5 9 2\n1`，输出 `3`。
starter_code: |
  #include <iostream>
  #include <vector>
  #include <algorithm>
  using namespace std;

  int main() {
      int n; cin >> n;
      vector<int> v(n);
      for (int i = 0; i < n; i++) cin >> v[i];
      int x; cin >> x;
      // count

      return 0;
  }
expected_output: |
  3
tests:
  - stdin: "8\n1 3 1 4 1 5 9 2\n1\n"
    expected_output: "3\n"
hints:
  - "cout << count(v.begin(), v.end(), x) << endl;"
  - "需要 #include <algorithm>"
  - "count_if 可加 lambda 条件计数"
