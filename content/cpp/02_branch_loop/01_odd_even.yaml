title: "判断奇偶"
topic: "02_branch_loop"
difficulty: 1
tags: ["if", "modulo"]
statement: |
  从标准输入读一个整数 `n`，奇数输出 `odd`，偶数输出 `even`。

  例如输入 `7`，应输出 `odd`。
starter_code: |
  #include <iostream>
  using namespace std;

  int main() {
      int n;
      cin >> n;
      // 在下面用 if/else 输出 odd 或 even

      return 0;
  }
expected_output: |
  odd
tests:
  - stdin: "7\n"
    expected_output: "odd\n"
hints:
  - "用 % 取余：if (n % 2 == 0) 偶数"
  - "字符串两侧用双引号"
  - "末尾用 endl 换行"
