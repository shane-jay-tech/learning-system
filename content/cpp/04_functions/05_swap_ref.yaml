title: "用引用交换两数"
topic: "04_functions"
difficulty: 3
tags: ["reference"]
statement: |
  定义 `void swap_ints(int& a, int& b)`，**用引用**交换两个整数的值。
  从输入读两个整数 `a b`，调用 `swap_ints(a, b)` 后输出 `a b`（中间空格）。

  输入 `3 5`，输出 `5 3`。
starter_code: |
  #include <iostream>
  using namespace std;

  // 在这里定义 swap_ints（用引用）

  int main() {
      int a, b;
      cin >> a >> b;
      swap_ints(a, b);
      cout << a << " " << b << endl;
      return 0;
  }
expected_output: |
  5 3
tests:
  - stdin: "3 5\n"
    expected_output: "5 3\n"
hints:
  - "void swap_ints(int& a, int& b) { int t = a; a = b; b = t; }"
  - "& 表示引用——参数变成外面变量的别名"
  - "C++ 标准库其实有 swap(a, b)，但这里要你自己写"
