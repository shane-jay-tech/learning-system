title: "写 add 函数"
topic: "04_functions"
difficulty: 1
tags: ["function", "return"]
statement: |
  请定义 `int add(int a, int b)` 返回 a+b。
  从标准输入读两个整数（空格分隔），调用并 cout 结果。

  输入 `3 5`，输出 `8`。
starter_code: |
  #include <iostream>
  using namespace std;

  // 在这里定义 add 函数

  int main() {
      int a, b;
      cin >> a >> b;
      cout << add(a, b) << endl;
      return 0;
  }
expected_output: |
  8
tests:
  - stdin: "3 5\n"
    expected_output: "8\n"
hints:
  - "int add(int a, int b) { return a + b; }"
  - "函数定义放在 main 之前"
  - "返回类型 int 不能省"
