title: "三数最大"
topic: "04_functions"
difficulty: 2
tags: ["function", "if-else"]
statement: |
  定义函数 `int max_of_three(int a, int b, int c)` 返回三者中最大的。
  从输入读三个整数（空格分隔），调用并输出。

  输入 `3 8 5`，输出 `8`。
starter_code: |
  #include <iostream>
  using namespace std;

  // 在这里定义 max_of_three

  int main() {
      int a, b, c;
      cin >> a >> b >> c;
      cout << max_of_three(a, b, c) << endl;
      return 0;
  }
expected_output: |
  8
tests:
  - stdin: "3 8 5\n"
    expected_output: "8\n"
hints:
  - "用嵌套 if 比较，或调用标准库 max(a, max(b, c))"
  - "需要 #include <algorithm> 才能用 max"
  - "也可以三元：return (a>b?a:b)>c?(a>b?a:b):c;"
