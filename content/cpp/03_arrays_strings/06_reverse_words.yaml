title: "反转字符串中的单词"
topic: "03_arrays_strings"
difficulty: 3
tags: ["string", "algorithm", "reverse"]
statement: |
  给定一个字符串 "hello world cpp"，反转其中每个单词的字母顺序（但单词顺序不变）。

  输出: "olleh dlrow ppc"

  用空格分隔单词，每个单词内部字母倒序。

starter_code: |
  #include <iostream>
  #include <string>
  #include <algorithm>
  #include <sstream>
  using namespace std;

  int main() {
      string s = "hello world cpp";
      // 反转每个单词的字母顺序，保持单词顺序不变
      return 0;
  }

expected_output: |
  olleh dlrow ppc
hints:
  - "用 istringstream 按空格拆分单词"
  - "用 reverse(word.begin(), word.end()) 反转单个单词"
  - "注意输出单词之间用空格连接"
