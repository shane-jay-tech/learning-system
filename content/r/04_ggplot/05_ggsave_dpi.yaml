title: "ggsave 高分辨率"
topic: "04_ggplot"
difficulty: 2
tags: ["ggplot", "ggsave"]
statement: |
  画一个简单折线图（年份 vs 销量），用 `ggsave` 保存到 `line.png`，**dpi=200, width=5, height=3**。
  再 cat 输出销量总和（应为 100）。
starter_code: |
  library(ggplot2)
  df <- data.frame(
    year = 2020:2024,
    sales = c(10, 20, 30, 25, 15)
  )
  # geom_line()，ggsave 带 dpi/width/height，再 cat sum

expected_output: |
  100
hints:
  - "p <- ggplot(df, aes(x=year, y=sales)) + geom_line()"
  - "ggsave(\"line.png\", p, dpi=200, width=5, height=3)"
  - "cat(sum(df$sales), \"\\n\")"
