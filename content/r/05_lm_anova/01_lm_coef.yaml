title: "lm 回归系数"
topic: "05_lm_anova"
difficulty: 2
tags: ["lm", "regression"]
statement: |
  数据：x=c(1,2,3,4,5), y=c(2,4,5,4,6)。请用 `lm` 拟合，输出**斜率系数**（保留 2 位小数）。

  应约 0.80。
starter_code: |
  df <- data.frame(x=c(1,2,3,4,5), y=c(2,4,5,4,6))
  # lm(y ~ x)，输出斜率（coef[2]）

expected_output: |
  0.8
hints:
  - "model <- lm(y ~ x, data = df)"
  - "cat(round(coef(model)[2], 2), \"\\n\")"
  - "coef[1] 是截距，coef[2] 是 x 的斜率"
