title: "CFA vs EFA"
topic: "15_cfa"
difficulty: 2
tags: ["cfa", "efa", "concept"]
judge_mode: ai_open
statement: |
  验证性因子分析 (CFA) 和探索性因子分析 (EFA) 是两种不同的方法。

  请说明：
  1. EFA 和 CFA 最核心的区别是什么？
  2. 什么时候用 EFA？什么时候用 CFA？
  3. 为什么同一份数据不能既做 EFA 又做 CFA？
  4. 在心理量表开发中，两者的使用顺序通常是什么？
starter_code: ""
rubric:
  - "EFA 是探索（不预设结构），CFA 是验证（预设好了结构去检验）"
  - "EFA 用于开发新量表/不确定结构时，CFA 用于验证已有量表的结构"
  - "同一份数据不能既探索又验证——会有循环论证（结构是数据给的，再用同一数据验证当然拟合好）"
  - "顺序: 样本 A 做 EFA → 样本 B 做 CFA 交叉验证"
reference_answer: |
  1. 核心区别: EFA 让数据「说话」——自动提取因子结构；CFA 是研究者预先指定结构然后检验数据是否支持
  2. EFA: 全新量表/不确定有几个维度时。CFA: 使用已有量表/已有理论预测的因子结构
  3. 循环论证: EFA 从数据中发现结构，再用同一数据验证=自己验证自己，必然拟合好，没有证明力
  4. 样本 A 做 EFA 确定结构 → 样本 B 做 CFA 验证结构（或用已有文献的结构直接 CFA）
hints:
  - "想象EFA是「发现金矿」，CFA是「确认这里确实是金矿」——不能用同一铲子挖和确认"
