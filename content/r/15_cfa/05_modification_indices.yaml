title: "修正指数（MI）与模型调整"
topic: "15_cfa"
difficulty: 4
tags: ["sem", "cfa", "modification"]
judge_mode: ai_open
statement: |
  用 lavaan 拟合 CFA 后查看 modification indices（modindices(fit)），
  解释 MI > 10 的含义，并说明什么时候应该（或不应该）根据 MI 加路径。
  提交完整代码与文字分析。
starter_code: |
  library(lavaan)
hints:
  - "modindices(fit) 输出 lhs/op/rhs/mi 四列，按 mi 降序看头部"
  - "MI > 10 的惯用阈值表示「加这条路径能让卡方显著下降」"
  - "思考维度：理论依据 vs 数据驱动——只看 MI 加路径有过拟合风险"
rubric:
  - "能跑 modindices(fit) 并按 mi 降序展示头部（op 含 =~ 或 ~ 的候选路径）"
  - "正确解释 MI 的含义：放松该约束预计能让卡方下降的量，MI > 10 为惯用关注阈值"
  - "能说出不该盲目加路径的理由：数据驱动改模型有过拟合/破坏理论先验风险，需理论依据支撑"
  - "给出至少一条「应该/不应该根据 MI 加路径」的情景判断"
