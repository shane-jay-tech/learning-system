title: "CFA 结果解读"
topic: "15_cfa"
difficulty: 3
tags: ["cfa", "lavaan", "interpretation"]
judge_mode: ai_open
statement: |
  以下是一份 9 题工作敬业度量表 (UWES-9) 的 CFA 结果：

  ```
  模型: 单因子（所有 9 题加载到一个"敬业度"因子）

  因子载荷:
  uwes_1: 0.72  uwes_2: 0.68  uwes_3: 0.81
  uwes_4: 0.75  uwes_5: 0.69  uwes_6: 0.77
  uwes_7: 0.63  uwes_8: 0.71  uwes_9: 0.74

  拟合指标:
  CFI = 0.943, TLI = 0.924, RMSEA = 0.065, SRMR = 0.042
  ```

  请回答：
  1. 所有因子载荷是否达标？标准是多少？
  2. 模型拟合如何？
  3. 基于这些结果，这份量表可以用吗？
starter_code: ""
rubric:
  - "载荷标准: >0.40 可接受，>0.70 好；最低的 uwes_7=0.63 也达标"
  - "拟合: CFI>0.90, TLI>0.90, RMSEA<0.08, SRMR<0.08 均达标"
  - "结论: 量表可用，单因子结构得到支持"
reference_answer: |
  1. 所有载荷 >= 0.63，均超过 0.40 的最低标准。多数 > 0.70 属于好。uwes_7 最低(0.63)但仍可接受。
  2. 拟合良好: CFI=0.943 > 0.90, TLI=0.924 > 0.90, RMSEA=0.065 < 0.08, SRMR=0.042 < 0.08。四项全部达标。
  3. 可以用。单因子模型得到数据支持，所有题目对"敬业度"这个构念有足够的贡献。可以把 9 题加总/求均值代表敬业度得分。
hints:
  - "因子载荷 = 这道题和潜变量的相关程度，越高说明题目越「称职」"
