title: "OR 几率比"
topic: "07_glm"
difficulty: 3
tags: ["glm", "odds-ratio"]
statement: |
  同上数据。请输出 years 的 **OR**（exp(coef)，保留 2 位小数）。

  应约 0.38（每多 1 年工龄，离职几率约为原来的 0.38 倍）。
starter_code: |
  df <- data.frame(
    leave = c(0,1,0,1,0,1,0,1),
    years = c(10,1,8,2,7,1,9,2)
  )
  # exp(coef(fit))["years"]

expected_output: |
  0
hints:
  - "fit <- glm(leave ~ years, data=df, family=binomial)"
  - "or <- exp(coef(fit))[\"years\"]"
  - "cat(round(or, 2), \"\\n\")"
