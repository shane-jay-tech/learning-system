title: "hclust 切 2 簇"
topic: "12_clustering"
difficulty: 2
tags: ["hclust", "cutree"]
statement: |
  对 scale(df) 做 `hclust(method="ward.D2")`，用 `cutree(k=2)` 切，输出每簇大小（升序）。

  应为 `3 3`。
starter_code: |
  df <- data.frame(
    age = c(22, 25, 23, 40, 42, 45),
    salary = c(4000, 4500, 4200, 12000, 13000, 12500)
  )
  d <- dist(scale(df))
  hc <- hclust(d, method = "ward.D2")
  # cutree(hc, k=2) 然后 sort(table(...))

expected_output: |
  3 3
hints:
  - "cl <- cutree(hc, k=2)"
  - "cat(sort(as.numeric(table(cl))), \"\\n\")"
  - "ward.D2 是论文中最常用方法"
