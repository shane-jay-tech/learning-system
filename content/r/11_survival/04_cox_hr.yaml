title: "Cox 模型 HR"
topic: "11_survival"
difficulty: 3
tags: ["coxph", "hazard-ratio"]
statement: |
  对数据拟合 `coxph(Surv(time, event) ~ years)`，输出 years 的 **HR**（exp(coef)，保留 2 位小数）。
starter_code: |
  suppressMessages(library(survival))
  df <- data.frame(
    time = c(12, 24, 8, 36, 5, 18, 30, 6, 22, 14),
    event = c(1, 0, 1, 0, 1, 1, 0, 1, 1, 1),
    years = c(2, 5, 1, 8, 1, 3, 6, 2, 4, 3)
  )
  fit <- coxph(Surv(time, event) ~ years, data=df)
  # exp(coef(fit))

expected_output: |
  0.11
hints:
  - "hr <- exp(coef(fit))[\"years\"]"
  - "cat(round(hr, 2), \"\\n\")"
  - "HR<1 表示工龄长是保护因子（不易离职）"
