title: "有调节的中介"
topic: "16_mediation"
difficulty: 3
tags: ["mediation", "moderation", "advanced"]
judge_mode: ai_open
statement: |
  你的导师说：
  > "你光检验中介不够，还要看这个中介效应是不是在不同条件下强度不同。"

  这就是「有调节的中介」(moderated mediation)。

  请回答：
  1. 什么是有调节的中介？和普通中介有什么区别？
  2. 调节变量 W 可以调节哪条路径？（画出可能的模型）
  3. 举一个 HR 例子：什么时候你会怀疑中介效应有调节？
  4. 在论文里怎么报告？（给一句模板）
starter_code: ""
rubric:
  - "有调节的中介 = 中介效应的大小取决于某个条件变量 W"
  - "W 可以调节 a 路径(X→M)、b 路径(M→Y)、或两者"
  - "举了合理例子（如：领导→授权→创新，但只有在创新氛围高的团队中才显著）"
  - "报告模板包含条件间接效应 + 在不同 W 水平下的差异"
reference_answer: |
  1. 有调节的中介 = 间接效应(a*b)不是一个固定值，而是随 W 变化。普通中介只报告一个间接效应值，有调节的中介报告"在W高时间接效应=X，在W低时=Y"。
  2. W 可以调节:
     - a 路径: X→M 的关系强度取决于 W
     - b 路径: M→Y 的关系强度取决于 W
     - 或两者都调节（较少见）
  3. HR 例子: 变革型领导(X)→心理授权(M)→创新行为(Y)，调节变量 W=团队创新氛围。猜想：在创新氛围高的团队，授权更容易转化为创新；氛围低时授权了也创新不起来。
  4. 报告模板: "有调节的中介效应显著 (Index of moderated mediation = 0.15, 95% CI [0.04, 0.28])。具体地，在创新氛围高时(+1SD)间接效应显著 (B = 0.31, CI [0.18, 0.45])，在创新氛围低时(-1SD)间接效应不显著 (B = 0.08, CI [-0.03, 0.19])。"
hints:
  - "核心问题: 中介效应对所有人都一样大吗？还是看条件？"
