title: "解释中介效应结果"
topic: "16_mediation"
difficulty: 1
tags: ["mediation", "interpretation", "basics"]
judge_mode: "ai_open"
statement: |
  研究发现：
  - 领导授权（X）→ 心理资本（M）：路径系数 a = 0.45, p < 0.001
  - 心理资本（M）→ 工作投入（Y）：路径系数 b = 0.38, p < 0.001
  - 间接效应 a×b = 0.17, 95% Bootstrap CI [0.09, 0.28]
  - 直接效应 c' = 0.22, p < 0.01

  请用大白话解释：
  1. 这个中介效应是否显著？为什么？
  2. 这是完全中介还是部分中介？
  3. 用一句话总结这个研究发现（给非统计背景的人听）。

rubric: |
  评分维度：
  - 显著性判断（30%）：是否说明 CI 不含 0 即显著
  - 中介类型（30%）：是否正确判断为部分中介（因为直接效应仍显著）
  - 通俗总结（40%）：是否用日常语言说清楚"领导授权通过提升心理资本来增加工作投入"

  通过标准：三个问题都有实质回答，核心判断正确

reference_answer: |
  1. 中介效应显著，因为 95% Bootstrap 置信区间 [0.09, 0.28] 不包含 0。
  2. 部分中介。因为加入中介变量后，直接效应 c'=0.22 仍然显著（p<0.01），说明领导授权还通过其他途径影响工作投入，心理资本只解释了一部分。
  3. 通俗版：领导越授权，员工心理资本越强，进而更投入工作——但授权也有一部分直接让人更投入（不只是通过心理资本这一条路）。
