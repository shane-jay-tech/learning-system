title: "APA 格式报告中介效应"
topic: "16_mediation"
difficulty: 3
tags: ["mediation", "apa", "writing"]
judge_mode: ai_open
statement: |
  以下是你的中介效应分析结果：

  - X = 变革型领导，M = 心理授权，Y = 创新行为
  - 路径 a (X→M): B = 0.45, SE = 0.08, p < .001
  - 路径 b (M→Y): B = 0.51, SE = 0.09, p < .001
  - 直接效应 c' (X→Y): B = 0.12, SE = 0.07, p = .09
  - 间接效应 a*b: B = 0.23, 95% Bootstrap CI [0.12, 0.35]
  - 总效应 c: B = 0.35, SE = 0.08, p < .001

  请写一段 APA 格式的结果报告（中文，3-5 句话），像论文"结果"部分那样写。
starter_code: ""
rubric:
  - "报告了总效应显著"
  - "报告了间接效应及 Bootstrap CI（不含 0 = 显著）"
  - "报告了直接效应不显著 → 完全中介"
  - "结论: 心理授权完全中介了变革型领导对创新行为的影响"
reference_answer: |
  变革型领导对创新行为的总效应显著 (B = 0.35, p < .001)。Bootstrap 中介检验表明，心理授权的间接效应显著 (B = 0.23, 95% CI [0.12, 0.35])，置信区间不含零。加入中介变量后，变革型领导对创新行为的直接效应不再显著 (B = 0.12, p = .09)，表明心理授权完全中介了变革型领导对创新行为的影响。即变革型领导主要通过提升员工心理授权感来促进创新行为。
hints:
  - "完全中介 = 直接效应不显著（加了 M 之后 X 对 Y 的影响消失了）"
  - "部分中介 = 直接效应还显著（M 解释了一部分但没全解释）"
