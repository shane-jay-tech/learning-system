title: "中介效应基本概念"
topic: "16_mediation"
difficulty: 2
tags: ["mediation", "concept"]
judge_mode: ai_open
statement: |
  回答以下关于中介效应的问题：

  1. 什么是中介效应？用 X → M → Y 的框架解释。
  2. 直接效应和间接效应分别是什么？
  3. 举一个 HR/组织行为学的中介效应例子。
  4. 为什么要检验中介效应？（和只做 X→Y 回归比，多了什么信息？）
starter_code: ""
rubric:
  - "正确解释了 X→M→Y（X 通过 M 影响 Y）"
  - "直接效应 = X→Y 的路径；间接效应 = X→M→Y 的路径乘积"
  - "举了合理的 HR 例子（如：领导风格→员工敬业度→离职）"
  - "中介告诉我们「为什么」X 会影响 Y（机制/过程）"
reference_answer: |
  1. X 通过影响 M，间接影响 Y。M 是中间传递环节。
  2. 直接效应 = 控制了 M 之后 X 对 Y 的影响（c' path）
     间接效应 = X→M 的系数 × M→Y 的系数（a*b）
  3. 例子：变革型领导(X) → 心理授权(M) → 创新行为(Y)
     领导不是直接让人创新，而是通过赋予自主权间接促进创新
  4. 只做 X→Y 只知道「有没有关系」，检验中介能知道「通过什么途径」产生的关系——这对干预策略很重要
hints:
  - "中介回答的核心问题: How/Why does X affect Y?"
