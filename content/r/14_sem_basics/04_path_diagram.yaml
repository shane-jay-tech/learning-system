title: "画路径图"
topic: "14_sem_basics"
difficulty: 2
tags: ["sem", "diagram", "visualization"]
judge_mode: ai_open
statement: |
  **场景**：你要研究「领导-成员交换关系 (LMX) → 工作敬业度 (UWES) → 离职倾向」。

  请用文字描述这个 SEM 模型的路径图：
  1. 列出所有潜变量和观测变量
  2. 画出测量模型（哪些题测量哪个潜变量）
  3. 画出结构模型（潜变量之间的路径方向）
  4. 工作敬业度在这里起什么角色？（提示：中介）

  用文字/ASCII 表示即可，不需要真的画图。
starter_code: ""
rubric:
  - "正确列出 3 个潜变量（LMX, UWES/敬业度, 离职倾向）"
  - "说明了测量指标（LMX 7 题, UWES 9 题, 离职倾向若干题）"
  - "结构路径方向正确: LMX → 敬业度 → 离职倾向"
  - "识别了敬业度是中介变量"
reference_answer: |
  潜变量: LMX(7题), 敬业度(9题), 离职倾向(3-5题)

  测量模型:
  LMX =~ lmx_1 + lmx_2 + ... + lmx_7
  敬业度 =~ uwes_1 + uwes_2 + ... + uwes_9
  离职倾向 =~ ti_1 + ti_2 + ti_3

  结构模型:
  LMX → 敬业度 → 离职倾向
  (可能还有直接路径: LMX → 离职倾向)

  角色: 敬业度是中介变量——LMX 通过提升敬业度来降低离职倾向
hints:
  - "中介 = A 影响 B，B 影响 C，B 就是中介"
