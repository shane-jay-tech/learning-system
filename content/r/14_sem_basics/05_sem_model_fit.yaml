title: "SEM 模型拟合与解读"
topic: "14_sem_basics"
difficulty: 4
tags: ["sem", "lavaan", "fit"]
judge_mode: ai_open
statement: |
  用 lavaan 拟合一个简单的 SEM 模型并解读拟合指标。

  步骤：
  1. 读取 sem_data.csv
  2. 定义测量模型：F1 =~ x1 + x2 + x3; F2 =~ y1 + y2 + y3
  3. 定义结构模型：F2 ~ F1
  4. 用 sem() 拟合（std.lv=TRUE）
  5. 输出 summary(fit, fit.measures=TRUE) 中的 CFI 和 RMSEA
  6. 判断 CFI >= 0.90 且 RMSEA <= 0.08 是否同时满足（输出 TRUE/FALSE）

  提交完整代码。
starter_code: |
  library(lavaan)
  model <- '
    F1 =~ x1 + x2 + x3
    F2 =~ y1 + y2 + y3
    F2 ~ F1
  '
hints:
  - "summary(fit, fit.measures=TRUE) 的输出里找 CFI 与 RMSEA 两行"
  - "fitMeasures(fit, c('cfi','rmsea')) 可以只取这两个指标"
  - "判断条件用 logical 与：cfi >= 0.90 & rmsea <= 0.08"
rubric:
  - "模型定义正确：F1 =~ x1+x2+x3、F2 =~ y1+y2+y3、F2 ~ F1，sem() 带 std.lv=TRUE"
  - "能从 summary(fit, fit.measures=TRUE) 正确读出 CFI 与 RMSEA 的数值"
  - "判断逻辑正确：CFI >= 0.90 且 RMSEA <= 0.08 同时满足才输出 TRUE"
  - "能对拟合结果做一句合理解读（如达标=模型可接受，不达标指出哪个指标拖后腿）"
