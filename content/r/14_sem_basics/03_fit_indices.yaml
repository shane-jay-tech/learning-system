title: "模型拟合指标解读"
topic: "14_sem_basics"
difficulty: 3
tags: ["sem", "fit", "interpretation"]
judge_mode: ai_open
statement: |
  SEM 模型跑完后需要看拟合指标判断模型好不好。
  以下是某个模型的拟合结果：

  ```
  CFI = 0.912
  TLI = 0.898
  RMSEA = 0.072 [90% CI: 0.061, 0.083]
  SRMR = 0.058
  Chi-square = 245.3, df = 89, p < .001
  ```

  请判断：
  1. 这个模型的拟合质量如何？（好/可接受/差）
  2. 哪些指标达标了？哪些没达标？（给出常用标准）
  3. 卡方检验显著是否意味着模型一定不好？为什么？
starter_code: ""
rubric:
  - "整体判断为「可接受但有改进空间」"
  - "CFI > 0.90 达标（勉强），TLI < 0.90 未达标"
  - "RMSEA < 0.08 达标，SRMR < 0.08 达标"
  - "解释了卡方在大样本下几乎总显著，不能单独作为判断标准"
reference_answer: |
  1. 整体可接受，但不算优秀（CFI 勉强达标，TLI 略低）
  2. 达标：CFI=0.912 > 0.90，RMSEA=0.072 < 0.08，SRMR=0.058 < 0.08
     未达标：TLI=0.898 < 0.90（差一点）
     常用标准：CFI/TLI > 0.90（好），> 0.95（优秀）；RMSEA < 0.08（可接受），< 0.06（好）；SRMR < 0.08
  3. 卡方在大样本（>200）下几乎一定显著，因为它对样本量极度敏感。所以学界不再单独用卡方判断，而是综合看 CFI/TLI/RMSEA/SRMR。
hints:
  - "CFI/TLI 是比较指标（和基线模型比），RMSEA/SRMR 是绝对指标"
  - "实际研究中，4 个指标综合看，不因为一个不达标就否定模型"
