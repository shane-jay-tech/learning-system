title: "解读模型拟合指标"
topic: "14_sem_basics"
difficulty: 1
tags: ["sem", "fit_indices", "interpretation"]
judge_mode: "ai_open"
statement: |
  一个 SEM 模型的拟合指标如下：
  - CFI = 0.87
  - TLI = 0.84
  - RMSEA = 0.092
  - SRMR = 0.065

  请回答：
  1. 这个模型的拟合好不好？
  2. 哪些指标不达标？标准是什么？
  3. 如果要改善拟合，你会怎么做？

rubric: |
  评分维度：
  - 整体判断（25%）：是否正确判断拟合不佳
  - 标准引用（40%）：是否知道 CFI/TLI > 0.90, RMSEA < 0.08, SRMR < 0.08
  - 改善建议（35%）：是否提到修正指数、删除载荷低的题目、检查交叉载荷等方法

  通过标准：正确判断不达标，引用正确标准值，给出至少一条改善建议

reference_answer: |
  1. 拟合不太好，大部分指标未达标。
  2. CFI=0.87 < 0.90（不达标）；TLI=0.84 < 0.90（不达标）；RMSEA=0.092 > 0.08（不达标）；SRMR=0.065 < 0.08（达标）。四个指标只有 SRMR 通过。
  3. 改善方法：查看修正指数（modification indices），找出残差相关高的题对；检查是否有载荷过低的题目可以删除；考虑是否有交叉载荷未被建模。
