title: "SEM 基本概念"
topic: "14_sem_basics"
difficulty: 2
tags: ["sem", "lavaan", "concept"]
judge_mode: ai_open
statement: |
  **结构方程模型 (SEM)** 是心理学/组织行为学中最常用的高级统计方法之一。

  请回答以下问题（用中文，每题 1-2 句话）：

  1. SEM 和普通回归的核心区别是什么？
  2. 什么是"潜变量"（latent variable）？举一个 HR 领域的例子。
  3. SEM 中"路径"（path）代表什么含义？
  4. 为什么 SEM 需要较大样本量（通常 >200）？
starter_code: ""
rubric:
  - "提到了 SEM 能同时估计测量模型和结构模型（回归只有结构）"
  - "正确解释了潜变量（不可直接测量的构念，如工作满意度/敬业度）"
  - "路径 = 变量间的因果/预测关系"
  - "样本量：因为参数多、需要稳定的协方差矩阵估计"
reference_answer: |
  1. SEM 能同时建模「不可观测的构念」和「构念之间的因果关系」，而普通回归只能处理可观测变量之间的关系。
  2. 潜变量 = 不能直接测量、需要通过多个题目间接反映的概念。HR 例子：员工敬业度（通过 UWES 9 道题测量）。
  3. 路径 = 一个变量对另一个变量的预测/影响关系，箭头方向代表因果假设方向。
  4. SEM 估计的参数很多（每个路径系数+每个载荷+误差方差），样本太小会导致估计不稳定、模型不收敛。
hints:
  - "想想普通回归能做什么、不能做什么——SEM 补充了什么。"
