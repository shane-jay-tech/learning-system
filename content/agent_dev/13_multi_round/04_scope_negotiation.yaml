title: "范围谈判：拒绝不合理蔓延"
topic: "13_multi_round"
difficulty: 3
tags: ["iteration", "scope"]
judge_mode: ai_open
statement: |
  你让 Agent 实现"用户个人资料页"。Agent 完成了基础实现后，主动提出：

  ```
  我注意到还可以做以下改进：
  1. 加一个头像上传功能（支持裁剪和压缩）
  2. 加社交账号绑定（微信/GitHub/Google）
  3. 加活动日志时间线（显示用户的所有操作记录）
  4. 把整个用户模块重构为微服务架构
  5. 加深色模式支持
  ```

  请对每个提议做出决策（接受/拒绝/延后），并写出：
  1. 你的决策和理由
  2. 给 Agent 的回复（告诉它做什么、不做什么）
  3. 你判断"该不该做"的标准是什么
starter_code: |
  # 对每个提议的决策：

  # 给 Agent 的回复：

  # 判断标准：

rubric: |
  1. 对5个提议都做了明确决策（接受/拒绝/延后）(15分)
  2. 决策理由基于"是否在当前需求范围内"(15分)
  3. 拒绝了明显过度的提议（如微服务重构）(15分)
  4. 合理接受或延后简单有价值的（如头像上传）(10分)
  5. 给Agent的回复清晰友好但坚定(15分)
  6. 判断标准具有普适性（如：是否阻塞主功能/ROI/复杂度）(15分)
  7. 体现了"完成比完美重要"的原则(15分)
hints:
  - "不是所有'好主意'都该现在做"
  - "判断标准：这个改动是否在解决当前用户的核心问题？"
