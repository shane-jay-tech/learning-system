title: "优先级排序：多个问题同时爆发"
topic: "13_multi_round"
difficulty: 3
tags: ["iteration", "priority", "triage"]
judge_mode: ai_open
statement: |
  周一早上你打开系统，发现以下 5 个问题同时出现：

  1. **P1 线上 bug**：用户反馈"提交订单后页面白屏"，错误率约 5%
  2. **P2 性能问题**：数据库查询变慢，Dashboard 加载从 1s 变成 8s
  3. **P3 新需求**：产品经理要求本周五前加一个通知功能
  4. **P4 技术债**：Agent 上次写的代码有 3 处代码质量问题（无影响但不规范）
  5. **P5 依赖告警**：npm audit 报了 2 个 moderate 级别漏洞（不影响运行）

  你只有一个 Agent 可用，一次只能做一件事。

  请：
  1. 排出处理优先级（从高到低）
  2. 说明每个决策的理由
  3. 写出第一个要处理的问题的 Agent 指令
  4. 说明哪些可以暂时不做（给出"暂不做"的判断标准）
starter_code: |
  # 优先级排序（从高到低）：

  # 判断理由：

  # 第一个问题的 Agent 指令：

  # 暂不做的项目和判断标准：

rubric: |
  1. P1放最高优先级（用户受损，线上影响）(15分)
  2. P2放第二（性能退化影响体验但不阻塞功能）(10分)
  3. 优先级理由合理（基于影响面和紧急度）(20分)
  4. 第一个问题的Agent指令具体可执行(20分)
  5. P4/P5合理判断为可延后（给出标准如"不影响用户"）(15分)
  6. 体现了"先止血再建设"的原则(20分)
hints:
  - "先问：谁在受损？受损程度如何？"
  - "技术债和audit告警不紧急，可以排到没有紧急事时再做"
