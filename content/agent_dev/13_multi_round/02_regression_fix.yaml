title: "回归修复：改一处坏一处"
topic: "13_multi_round"
difficulty: 3
tags: ["iteration", "regression"]
judge_mode: ai_open
statement: |
  你让 Agent 修复了一个 bug："用户列表页的分页在第二页显示空白"。

  Agent 修了分页逻辑（改了 SQL 的 OFFSET 计算），但修完后出现了新问题：
  1. 搜索功能失灵了——搜索后仍显示全部用户而非搜索结果
  2. "导出当前页"按钮现在导出的是所有数据而非当前页

  **你的诊断**：Agent 把分页参数从 URL query params 改成了 session storage，但搜索和导出模块还在读 URL params。

  请写出给 Agent 的**修复指令**，要求：
  1. 修复回归问题
  2. 说明根因（为什么改分页会影响搜索和导出）
  3. 要求 Agent 验证改动不会产生新的回归
  4. 提出防止类似问题再次发生的措施
starter_code: |
  # 请在下面写出修复指令

rubric: |
  1. 正确定位根因（参数来源不一致）(20分)
  2. 提出一致的解决方案（统一参数来源）(20分)
  3. 要求验证搜索和导出都正常工作(15分)
  4. 要求列出所有读取分页参数的模块（影响面分析）(15分)
  5. 提出防回归措施（如测试、接口约定）(15分)
  6. 指令清晰可执行(15分)
hints:
  - "根因是不同模块对'当前分页状态'的读取方式不一致"
  - "修复不是'改回去'，而是让所有模块用同一个数据源"
