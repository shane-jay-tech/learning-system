title: "需求变更：新增字段"
topic: "13_multi_round"
difficulty: 2
tags: ["iteration", "change-management"]
judge_mode: ai_open
statement: |
  你让 Agent 做了一个用户注册表单，已经上线运行了一周。现在产品要求：

  **新需求：注册时增加"部门"字段（下拉选择），选项为：技术部/产品部/运营部/市场部**

  Agent 之前的交付包括：
  - 前端：React 表单组件（姓名、邮箱、密码）
  - 后端：POST /api/register 接口
  - 数据库：users 表（id, name, email, password_hash, created_at）

  请写出给 Agent 的**增量修改指令**，要求：
  1. 不重写现有代码，只做增量修改
  2. 说明要改哪些文件/模块
  3. 保护现有功能不受影响
  4. 给出验收标准
starter_code: |
  # 请在下面写出增量修改指令

rubric: |
  1. 明确是增量修改而非重写（强调保留现有代码）(15分)
  2. 列出需要修改的具体位置（前端表单/后端接口/数据库schema）(20分)
  3. 包含数据库迁移（加字段而不是重建表）(15分)
  4. 处理了向后兼容（已有用户department为空怎么办）(15分)
  5. 写出了验收标准（新注册有部门/老用户正常/下拉选项正确）(20分)
  6. 明确了不要改动的范围(15分)
hints:
  - "数据库已有数据，加字段要考虑已有行"
  - "前后端接口都要改，但要确保不破坏现有登录流程"
