title: "完整迭代：从 v1 到 v3"
topic: "13_multi_round"
difficulty: 4
tags: ["iteration", "comprehensive"]
judge_mode: ai_open
statement: |
  你要做一个"团队日报系统"。请规划从 v1 到 v3 的三轮迭代，每轮给 Agent 的 Spec。

  **背景：**
  - 10 人团队使用
  - 每天每人写一段日报（今日完成/明日计划/遇到的问题）
  - 主管能看到所有人的日报汇总

  **约束：**
  - v1 必须一周内上线（最小可用）
  - v2 基于 v1 用户反馈迭代
  - v3 加入自动化和智能功能

  请写出：
  1. **v1 Spec**：最小可用版本（核心功能，砍掉一切花哨）
  2. **v1 → v2 的假设用户反馈**（你预测会收到什么反馈）
  3. **v2 Spec**：基于反馈的增量改进
  4. **v3 Spec**：加入一个 AI/自动化功能
  5. 每版的验收标准
starter_code: |
  # v1 Spec（最小可用）：

  # 预测的用户反馈：

  # v2 Spec（增量改进）：

  # v3 Spec（智能功能）：

rubric: |
  1. v1足够精简（只有写日报+看汇总，没有多余功能）(15分)
  2. v1有明确验收标准(10分)
  3. 预测的反馈合理（如格式不统一/忘记写/想看历史）(15分)
  4. v2直接解决预测的反馈问题(15分)
  5. v3的AI功能合理可实现（如自动提醒/摘要/趋势分析）(15分)
  6. 三版之间有增量关系（不是推翻重来）(15分)
  7. 体现了"先上线再优化"的迭代思维(15分)
hints:
  - "v1 的关键是'能用'，不是'好用'"
  - "v2 的关键是'解决真实痛点'，不是'加功能'"
