title: "这段「容错」代码藏了什么隐患？"
topic: "08_read_code"
difficulty: 3
tags: ["read-code", "error-handling", "open", "ai_judge"]
judge_mode: ai_open
statement: |
  有人为了让程序"别动不动就报错"，这样写：

  ```python
  def load_scores(path):
      try:
          with open(path) as f:
              return [int(line) for line in f]
      except:
          return []
  ```

  请回答：
  1. 这段代码"出错就返回空列表"，会带来什么**隐患**？举一个会让你被坑的场景。
  2. 更好的写法是什么？

  用你自己的话答。
starter_code: ""
rubric:
  - "识别隐患：错误被静默吞掉，分不清'文件真的是空的'还是'读取/解析失败了'，问题被藏起来很难排查"
  - "举出场景：比如文件路径写错、某行不是数字，本该报警，结果你拿到空列表却以为'没数据'，分析结论被悄悄带偏"
  - "改进点1：不要裸 except，应捕获具体异常（FileNotFoundError / ValueError）"
  - "改进点2：至少把错误记下来（日志/打印/重新抛出），别让它无声消失"
reference_answer: |
  1. **隐患**：裸 `except:` 把**所有错误都吞了**，然后假装"没数据"返回 `[]`。问题是你**分不清**到底是文件本来就空，还是路径写错了、某一行不是数字、文件权限不对……
     - **被坑的场景**：你把文件名拼错了，程序不报错、安静返回 `[]`，你的分析显示"这个部门 0 条数据"，于是得出"该部门没人答题"的错误结论——其实数据一直在，只是没读到。错误被藏起来，排查时一头雾水。
  2. **更好的写法**：
     - 不要裸 `except`，**捕获具体异常**：`except FileNotFoundError` / `except ValueError`，不同错误分别处理；
     - 至少要**留痕**：打日志或打印出错信息，或者直接把异常**重新抛出**，让你知道"出事了"而不是无声吞掉；
     - 真正"文件不存在就当空"的逻辑，也应该是**明确判断**（先检查文件在不在），而不是用 except 兜底一切。
  核心原则：**错误可以处理，但不能假装没发生。**
hints:
  - "问自己：如果路径写错了，这段代码会告诉你吗？"
  - "返回 [] 时，你能分清'真没数据'和'读失败了'吗？"
  - "裸 except 的问题是它把所有错误都一视同仁地藏起来了。"
