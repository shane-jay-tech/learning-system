title: "日志级别策略与排错流"
topic: "10_debug_logs"
difficulty: 3
tags: ["logging", "debug", "strategy"]
judge_mode: ai_open
statement: |
  描述 Agent 项目的日志级别策略（DEBUG/INFO/WARN/ERROR 各用于什么），
  并说明当用户报告"回答质量突然下降"时你的排错流。

  排错流需覆盖：模型端/API 端/数据端三层排查。
starter_code: |
  # 文字分析
hints:
  - "级别语义：DEBUG=诊断细节、INFO=关键路径、WARN=可自愈异常、ERROR=需要人看"
  - "排错流从「什么时候开始变差」切入：先看变更面（模型/配置/数据），再看日志分层"
  - "三层排查对应：模型端（版本/参数）、API 端（限流/超时/错误码）、数据端（检索质量/注入内容）"
rubric:
  - "四级日志语义准确：DEBUG 诊断细节 / INFO 关键路径 / WARN 可自愈 / ERROR 需人工"
  - "排错流从「变更面」切入（模型端/API 端/数据端三层各自有具体排查动作）"
  - "API 层提到限流、超时、错误码等可观测信号"
  - "数据层提到检索质量或输入内容变化这类易被忽视的因素"
