title: "把 bug 描述写成可复现的 Spec"
topic: "07_write_spec"
difficulty: 2
tags: ["spec", "bug", "ai_judge"]
judge_mode: ai_open
statement: |
  **场景**：你发现了一个 bug，想让 AI agent 帮你修：
  > "登录有时候会失败。"

  这句话信息不够。请把它改写成一份**可复现的 bug 报告**，
  让 AI 能定位并修复问题。

  假设你已经观察到：用中文密码登录时 100% 失败，英文密码正常。
starter_code: ""
rubric:
  - "写清楚了复现步骤（step by step）"
  - "区分了 expected vs actual 结果"
  - "包含了环境信息（浏览器/系统/版本）"
  - "缩小了范围（中文密码 vs 英文密码）"
reference_answer: |
  Bug: 中文密码登录 100% 失败
  环境: Chrome 126 / Windows 11 / 系统版本 v2.1.3
  复现步骤:
  1. 打开登录页 /login
  2. 输入用户名: testuser
  3. 输入密码: 测试密码123（含中文）
  4. 点击"登录"
  Expected: 跳转到首页
  Actual: 停留在登录页，提示"密码错误"
  附加观察: 同一账号用英文密码 Test123abc 可正常登录
  猜测: 后端对密码做了 ASCII-only 校验或编码有误
hints:
  - "bug 报告的核心：别人按你的步骤操作，能不能 100% 看到同样的错。"
