title: "为「导出 PDF」功能写完整 Spec"
topic: "07_write_spec"
difficulty: 2
tags: ["spec", "feature", "ai_judge"]
judge_mode: ai_open
statement: |
  **场景**：你正在开发一个笔记 App，产品经理说：
  > "加一个导出 PDF 的功能吧。"

  请写一份完整的功能需求 Spec，让 AI agent 看完就能直接实现。

  要求：用中文，分点写，涵盖输入/输出/边界/验收标准。
starter_code: ""
rubric:
  - "说清楚导出的内容范围（当前笔记？选中的几篇？全部？）"
  - "说清楚 PDF 的格式要求（分页、字体、是否保留图片/链接）"
  - "给出至少一个验收标准（怎样算做完？）"
  - "考虑了异常（笔记为空时、图片加载失败时）"
reference_answer: |
  一份合格的 Spec 至少包含：
  - 输入：用户选中 1-N 篇笔记（若不选则导出当前打开的）
  - 输出：一个 .pdf 文件，保存到用户指定路径
  - 格式：A4，标题用 16pt 粗体，正文 12pt，图片保留原尺寸但不超过页宽
  - 异常：笔记内容为空时弹窗提示"没有可导出内容"；图片加载失败显示占位图
  - 验收标准：导出后用 PDF 阅读器打开，内容与原笔记一致
hints:
  - "想想用户从点击「导出」到拿到文件的完整流程。"
  - "验收标准 = 怎么证明这个功能做对了？"
