statement: |
  让 LLM 先输出"思考过程"再给答案的 prompting 技术，缩写是什么？
  输出英文缩写（3 个大写字母）。

  期望：`CoT`（也接受 `COT`，但题目锁定 `CoT`）。
starter_code: |
  abbr = "..."
