title: "把模糊需求写成清晰 Spec"
topic: "03_spec_writing"
difficulty: 3
tags: ["spec", "open", "ai_judge"]
judge_mode: ai_open
statement: |
  这是一道**开放题**——没有标准答案，用你自己的话作答，AI 老师会按评分标准点评。

  **场景**：你想让 AI（比如 Claude Code）帮你写一个小工具：
  > “帮我做一个能把我导出的 CSV 数据整理一下的脚本。”

  这句话太模糊，AI 没法直接动手。请你把它**改写成一份清晰的需求 Spec**，
  让一个第一次接触这个任务的人（或 AI）看完就知道该做什么。

  用中文写，分点写清楚即可，不用写代码。
starter_code: ""
rubric:
  - "输入：说清楚输入是什么（CSV 长什么样？有哪些列？大概多少行？哪来的？）"
  - "输出：说清楚要得到什么结果（整理成什么样？存成什么文件？还是打印？）"
  - "示例：给至少一个「输入长这样 → 输出应该长这样」的具体例子"
  - "边界：考虑异常情况（空文件、缺失值、列名不对、编码问题等至少一种）"
  - "约束：有没有限制（用什么语言/库？不能依赖联网？运行环境？）"
reference_answer: |
  一份合格的 Spec 大致长这样（要点齐全即可，措辞不必相同）：

  **任务**：写一个 Python 脚本，清洗并整理一份员工敬业度调查 CSV。

  - **输入**：一个 CSV 文件 `survey.csv`，约 500 行，列有 `员工ID, 部门, 敬业度评分(1-5), 提交日期`。
    部分行可能有缺失的评分，部门名称大小写/空格不统一。
  - **输出**：一个新的 `survey_clean.csv`：删除评分缺失的行，部门名统一为去空格小写，
    再额外打印每个部门的平均敬业度评分（保留 1 位小数）。
  - **示例**：输入有 `张三, 研发 , , 2026-05-01`（评分空）这行 → 输出里这行被删除。
  - **边界**：文件为空时给出提示而不是报错；列名缺失时明确报错说明缺哪列；按 UTF-8 读取。
  - **约束**：用 Python + pandas，不联网，能在本地直接 `python clean.py` 运行。
hints:
  - "回想我们说的 5 个 key：input / output / examples / edge_cases / constraints，一个都别漏。"
  - "越具体越好——'整理一下'是模糊，'删除评分缺失的行并按部门算平均分'是清晰。"
