title: "PR 评审清单：五步法"
topic: "08_review_pr"
difficulty: 3
tags: ["review", "checklist", "pr"]
judge_mode: ai_open
statement: |
  描述你做 PR 评审的五步清单，并说明每步关注什么。

  步骤：
  1. 整体描述理解
  2. 逻辑正确性
  3. 边界与异常
  4. 测试覆盖
  5. 风格与一致性

  每步给出 1-2 句说明。
starter_code: |
  # 文字分析
hints:
  - "第一步先读 PR 描述与 diff 全貌，别一上来就逐行抠"
  - "边界与异常重点看：空输入/超长输入/并发/失败重试"
  - "测试覆盖看「改了行为却没改测试」的静默漂移"
rubric:
  - "五步齐全且顺序合理：整体理解→逻辑→边界异常→测试→风格"
  - "每步有具体关注点，不是复述步骤名"
  - "边界异常步能举出至少两类真实风险（空输入/并发/失败重试等）"
  - "测试步强调「行为变更必须同步测试」的静默漂移问题"
