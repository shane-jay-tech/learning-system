title: "好架构的真正回报：改得动、不怕崩"
topic: "05_modular_config"
difficulty: 3
tags: ["architecture", "maintainability", "open", "ai_judge"]
judge_mode: ai_open
statement: |
  有人说："我的工具就我一个人用，能跑就行，何必费劲分模块、起名字、写得这么讲究？"

  请你回应这个观点（你正好有长期在维护的系统，可以结合体会）：
  1. 对一个**会长期用、不断加功能**的个人系统，"架构讲究一点"的回报体现在哪？
  2. 是不是所有项目都值得这么讲究？什么情况下"能跑就行"反而是对的？
  3. 给一条你自己会遵守的、低成本高回报的架构习惯。
starter_code: ""
rubric:
  - "说出长期回报：改一处不怕碰坏别处、几个月后回来还看得懂、加新功能成本低、出 bug 好定位"
  - "有分寸感（关键）：不是所有项目都要重架构——一次性脚本、抛弃型小实验，'能跑就行'是对的；过度设计也是成本"
  - "判断标准：看这东西会不会长期存活、会不会反复改、会不会被复用——会，就值得讲究"
  - "给出一条具体习惯：如分层、给变量起能看懂的名、配置和代码分开、函数单一职责等，且说明它便宜在哪"
reference_answer: |
  1. **长期回报**：对一个会长期用、不断加功能的系统，架构讲究的回报是"**改得动**"——
     - 改一处不会牵连一片，加新功能不用提心吊胆；
     - 几个月后回来看，靠清晰的命名和分层还读得懂自己写的东西；
     - 出 bug 时，分层让你能快速定位是界面、算法还是数据的问题。
     你那两个长期维护的系统能一路加功能不崩，吃的就是这个红利。
  2. **要有分寸**：不是所有项目都值得。**一次性脚本、试验性小代码、跑完就扔的东西**，"能跑就行"才是对的——给它分三层、写一堆抽象反而是浪费（过度设计也是成本）。判断标准很简单：**这东西会长期活着、会被反复改、会被复用吗？** 会，就值得讲究；不会，就别折腾。
  3. **一条低成本高回报的习惯**（举一例即可）：**给变量和函数起"看一眼就懂"的名字**。几乎不花额外时间，却让代码半年后还读得懂、让 AI 帮你改时更不容易理解错。（或：把配置/密钥和代码分开、一个函数只干一件事——都是便宜又值的习惯。）
hints:
  - "想想你维护几个月的系统——架构帮你省了什么痛苦？"
  - "反过来想：什么项目'能跑就行'确实够了？别一刀切。"
  - "挑一条几乎不费成本、回报却很大的习惯。"
