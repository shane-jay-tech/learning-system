title: "为什么要分三层？用你自己的系统说"
topic: "05_modular_config"
difficulty: 3
tags: ["architecture", "layering", "open", "ai_judge"]
judge_mode: ai_open
statement: |
  一个系统常被拆成三层：**界面层（UI）/ 业务层（core）/ 数据层（data）**。

  请用**你自己的话**回答（如果你有自己做的系统——比如量化工具、心理分析工具——拿它举例更好）：
  1. 这三层各自负责什么？
  2. 分开有什么**实际好处**？举一个"如果不分、全堆一起会怎样"的具体场景。
  3. 有没有一条原则，是这种分层必须守住的？
starter_code: ""
rubric:
  - "三层职责说对：UI 管展示和交互、core 管业务逻辑/算法、data 管存取（数据库/文件）"
  - "说出实际好处：改一层不影响其他层 / 业务逻辑可复用（换 UI 不用重写）/ 换数据库业务不变"
  - "举出反面场景：全堆一起时，改个界面会牵动算法、加功能容易把别处弄崩（牵一发动全身）"
  - "守住的原则：UI 不直接碰数据库、业务层不关心用什么界面（依赖方向单向、关注点分离）"
reference_answer: |
  1. **三层职责**：
     - **界面层(UI)**：管展示和用户交互（Streamlit 页面、按钮、表格）；
     - **业务层(core)**：管真正的逻辑和算法（量化的选股/回测、心理系统的打分/分析）；
     - **数据层(data)**：管数据怎么存怎么取（SQLite、文件读写）。
  2. **好处**：改一层不波及其他层。比如想换个更好看的界面，只动 UI，回测算法一行都不用改；想把存储从 SQLite 换成别的，只动 data 层，业务逻辑不受影响；业务逻辑还能复用——同一套算法，配 Web 界面或命令行都行。
     - **反面场景**：如果界面、算法、读写全堆在一个 1500 行的文件里，改个按钮位置可能不小心碰坏了回测逻辑，加个新功能跑通了、别处又崩——"牵一发动全身"，越改越怕改。
  3. **必须守住的原则**：**UI 不直接操作数据库，业务层不关心用的是什么界面**。依赖方向单向往下，各层只管自己那摊事（关注点分离）。这正是你那两个系统能一直加功能而不崩的原因。
hints:
  - "先想：展示、算、存——这三件事分别归谁管？"
  - "想想你自己的系统：如果想换界面，是不是不该动到算法？"
  - "关键那条线：界面能不能直接去读写数据库？"
