title: "三轮迭代完善 Spec"
topic: "12_spec_iteration"
difficulty: 4
tags: ["spec", "iteration", "comprehensive"]
judge_mode: ai_open
statement: |
  你正在让 Agent 帮你做一个"学习进度导出为 PDF 报告"的功能。

  **第一轮 Spec（你写的）：**
  ```
  加一个按钮，点击后把用户的学习进度导出成 PDF。
  ```

  **Agent 第一轮产出问题：**
  - PDF 里只有一行纯文本"进度：50%"
  - 没有图表、没有分科目数据
  - 按钮放在了页面最底部，用户找不到

  **第二轮 Spec（你写的）：**
  ```
  PDF 报告要包含：各科目通过率柱状图、最近14天趋势折线图、错题列表。
  按钮放在 Dashboard 顶部右侧。
  ```

  **Agent 第二轮产出问题：**
  - 图表生成了但 PDF 中图片模糊
  - 错题列表包含了所有历史错题（上千条），PDF 有 30 页
  - 中文字体显示为方块

  请写出**第三轮 Spec**，解决以上所有问题，并预防更多潜在问题。
  同时写出这三轮迭代教给你的**3 条 Spec 写作原则**。
starter_code: |
  # 第三轮 Spec：

  # 三条 Spec 写作原则：

rubric: |
  1. 解决图片模糊（指定 DPI 或图片尺寸）(10分)
  2. 解决错题过多（限制条数或只显示最近N条）(10分)
  3. 解决中文字体（指定字体文件或要求验证中文显示）(10分)
  4. 预防了其他问题（文件大小限制、生成超时、文件名规则等）(15分)
  5. 第三轮Spec完整可执行（不模糊、有验收标准）(20分)
  6. 总结的原则有普适性（不只是PDF相关）(20分)
  7. 原则基于实际迭代教训（不是泛泛而谈）(15分)
hints:
  - "每轮问题都暴露了上一轮 Spec 的遗漏"
  - "总结原则时想想：如果一开始就知道这些，第一轮就能写对吗？"
