title: "Agent 跑偏了，修正 Spec"
topic: "12_spec_iteration"
difficulty: 3
tags: ["spec", "iteration", "debug"]
judge_mode: ai_open
statement: |
  你给 Agent 写了这份 Spec：

  ```
  在用户列表页加一个搜索框，支持按姓名搜索用户。
  ```

  Agent 交付了代码，但出了以下问题：
  1. 搜索是精确匹配——输入"张"找不到"张三"
  2. 搜索会触发整个页面刷新，体验很差
  3. 没有处理空搜索（搜索框清空后列表消失了）
  4. Agent 顺手把用户列表从表格改成了卡片布局（你没要求这个）

  请写出**修正后的 Spec 第二版**，让 Agent 下一轮能修复所有问题。

  要求：
  - 针对每个问题给出明确的修正指令
  - 补充原 Spec 遗漏的边界条件
  - 明确告诉 Agent 不要做什么（防止再次蔓延）
starter_code: |
  # 请在下面写出修正后的 Spec v2

rubric: |
  1. 明确要求模糊匹配/包含匹配（解决精确匹配问题）(15分)
  2. 要求无刷新/局部更新（解决体验问题）(15分)
  3. 处理空输入边界（搜索清空时恢复完整列表）(15分)
  4. 明确禁止修改列表布局/样式（防蔓延）(15分)
  5. 补充了其他边界（如大小写、特殊字符、无结果提示）(20分)
  6. 语句清晰可执行，不模糊(20分)
hints:
  - "每个问题都对应原 Spec 的一个遗漏"
  - "想想还有什么边界条件没覆盖"
