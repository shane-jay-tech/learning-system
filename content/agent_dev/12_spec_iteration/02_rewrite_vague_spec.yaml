title: "改写模糊 Spec"
topic: "12_spec_iteration"
difficulty: 3
tags: ["spec", "iteration", "rewrite"]
judge_mode: ai_open
statement: |
  Agent 收到以下 Spec 后产出了一堆不相关的代码（重构了路由、改了数据库 schema、加了新的中间件），完全不是你想要的。

  **原始 Spec：**
  ```
  给系统加一个导出功能，让用户可以把数据导出来。
  ```

  请**重写这份 Spec**，使 Agent 下一次执行时能产出正确的结果。

  要求：
  - 明确导出什么数据（哪个页面、哪些字段）
  - 明确导出格式（CSV / JSON / Excel）
  - 明确触发方式（按钮位置、交互流程）
  - 写出验收标准（怎么算"做完了"）
  - 明确范围（不要改动哪些东西）
starter_code: |
  # 请在下面写出改写后的 Spec

rubric: |
  1. 明确了导出的数据来源（哪个页面/模块的数据）(15分)
  2. 明确了数据字段（不是泛泛的"数据"）(15分)
  3. 明确了导出格式（至少一种具体格式）(15分)
  4. 明确了触发方式和 UI 位置(15分)
  5. 写出了可验证的验收标准（至少2条）(20分)
  6. 设定了范围约束（不允许改什么）(20分)
hints:
  - "想象你是产品经理，给工程师写需求单"
  - "验收标准 = '我怎么确认这个功能做对了'"
