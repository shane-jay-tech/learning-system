title: "诊断坏 Spec"
topic: "12_spec_iteration"
difficulty: 2
tags: ["spec", "iteration"]
judge_mode: ai_open
statement: |
  下面是一份写给 AI Agent 的 Spec：

  ```
  帮我优化一下这个页面的性能，加载太慢了。顺便把那个按钮的颜色改成蓝色。
  另外用户反馈说搜索不好用，也看看能不能改善一下。
  ```

  请指出这份 Spec 的**至少 4 个具体问题**，并说明每个问题会导致 Agent 产生什么不良行为。

  格式要求：每个问题一段，先写问题，再写后果。
starter_code: |
  # 请在下面写出你的分析

rubric: |
  1. 指出"优化性能"缺乏量化标准（如加载时间目标）(15分)
  2. 指出混合了三个不相关需求（性能/颜色/搜索）(20分)
  3. 指出"搜索不好用"缺乏具体问题描述（哪里不好用）(15分)
  4. 指出缺少验收标准（怎么判断"优化完了"）(15分)
  5. 指出缺少边界/约束（可以改哪些文件、不能改什么）(15分)
  6. 每个问题都说明了后果（Agent会怎样）(20分)
hints:
  - "想想如果你是 Agent，读到这份 Spec 会怎么做"
  - "一条 Spec 塞了几件不相关的事？"
