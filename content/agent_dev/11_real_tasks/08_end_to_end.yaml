title: "端到端：从需求到交付"
topic: "11_real_tasks"
difficulty: 5
tags: ["comprehensive", "real-task"]
judge_mode: ai_open

statement: |
  老板说："给我们的内部工具加一个'暗色模式'切换按钮。"

  这是一个完整的小功能。请写出你指挥 AI agent 完成这个功能的**全流程**：

  1. **需求澄清**：你会问老板哪些问题？（至少 2 个）
  2. **Spec**：写一份简短的功能规格说明（含验收标准）
  3. **任务拆解**：拆成 agent 可执行的步骤
  4. **审查要点**：agent 交付后你会重点检查什么？

  注意：不需要你写代码，只需要写"指挥文档"。

starter_code: |
  # 在这里写你的全流程指挥文档

rubric:
  - "需求澄清问题有价值（如：要不要跟随系统设置？覆盖范围多大？要不要记住选择？）得 20 分"
  - "Spec 含验收标准且可检验（不是'做出来就行'）得 20 分"
  - "任务拆解合理且粒度适当（3-5 步）得 20 分"
  - "审查要点命中关键项（切换是否丝滑/是否持久化/是否有闪烁/对比度是否达标）得 20 分"
  - "整体流程连贯、可执行、不遗漏关键环节得 20 分"

reference_answer: |
  ## 1. 需求澄清（问老板）

  - 暗色模式只改主题色，还是所有组件都要适配（图表、图片、第三方嵌入）？
  - 用户选择需要持久化吗？下次打开还是暗色？
  - 要不要跟随操作系统的暗色设置（prefers-color-scheme）？
  - 切换按钮放哪里？顶栏右上角？设置页？

  ## 2. Spec

  **功能**：用户点击切换按钮，全局切换亮/暗主题。
  **范围**：所有页面、所有组件。
  **持久化**：localStorage 记住选择，下次打开保持。
  **默认值**：跟随系统设置（prefers-color-scheme）。
  **验收标准**：
  - [ ] 点击按钮，0.3s 内全部颜色切换完成，无闪烁
  - [ ] 刷新页面后保持选择
  - [ ] 暗色模式下所有文字对比度 ≥ 4.5:1（WCAG AA）
  - [ ] 图表、代码块、输入框都有暗色适配

  ## 3. 任务拆解

  1. 定义 CSS 变量（--bg, --text, --border 等）+ 两套主题值
  2. 实现切换逻辑（按钮 + localStorage + 初始化读取）
  3. 全局样式迁移（把硬编码颜色改为 CSS 变量引用）
  4. 逐页检查适配（图表/代码块/第三方组件）

  ## 4. 审查要点

  - 切换时有没有闪烁（FOUC）？——初始化要在 DOM 渲染前读 localStorage
  - 对比度够不够？——用浏览器 DevTools 的对比度检查
  - 有没有漏网之鱼？——检查所有 background-color 和 color 是否都走变量
  - 代码有没有 !important 滥用或魔法数字？

hints:
  - "暗色模式最常见的 bug 是什么？（闪烁、对比度不够、遗漏组件）"
  - "agent 最容易忽略什么？（第三方组件、图表、滚动条样式）"
  - "验收标准要怎么写才能让你'一看就知道做没做到'？"
