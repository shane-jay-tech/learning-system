title: "控制 Agent 范围膨胀"
topic: "11_real_tasks"
difficulty: 3
tags: ["spec", "scope", "real-task"]
judge_mode: ai_open

statement: |
  你让 AI agent "给用户列表页加一个搜索框"。agent 回复说它打算这样做：

  > 我会实现以下内容：
  > 1. 添加搜索框组件
  > 2. 实现全文搜索（用 Elasticsearch）
  > 3. 添加搜索历史记录功能
  > 4. 实现搜索建议（自动补全）
  > 5. 添加搜索结果高亮
  > 6. 实现按部门/角色/入职日期的高级筛选
  > 7. 添加搜索结果导出功能
  > 8. 实现搜索分析统计面板

  这是典型的"范围膨胀"（scope creep）——agent 想做太多了。

  请写一条回复，把范围收回来。要求：
  - 明确告诉 agent 只做什么（MVP 范围）
  - 明确告诉它不做什么（排除项）
  - 解释为什么要砍（不是"我觉得不需要"，要有理由）

starter_code: |
  # 在这里写你给 agent 的范围控制指令

rubric:
  - "明确定义了 MVP 范围（前端搜索框 + 后端简单筛选，够用就行）得 25 分"
  - "明确列出排除项（Elasticsearch/历史/导出等不做）得 20 分"
  - "给出合理的理由（不是'太复杂'而是'用户量/数据量不需要/当前阶段优先级'）得 25 分"
  - "语气坚定但不失礼（不是骂 agent，是给边界）得 15 分"
  - "提到了未来可以迭代（给 agent 台阶下，不是永远不做）得 15 分"

reference_answer: |
  ## 范围控制

  停一下，你想的太多了。这次只做 MVP：

  **只做：**
  - 一个输入框，输入后按用户名和部门做**前端模糊过滤**（当前数据不超过 500 人，不需要后端搜索）
  - 输入防抖 300ms，避免频繁过滤

  **不做（本次排除）：**
  - ❌ Elasticsearch — 500 人的列表，前端 filter 已经毫秒级
  - ❌ 搜索历史/自动补全 — 没有用户反馈需要这个
  - ❌ 高级筛选面板 — 等到用户真正提出需求再加
  - ❌ 搜索导出/统计 — 和"搜索框"这个需求无关

  **为什么砍：**
  用户只是说"列表太长找不到人"，解决方案是一个 input + filter。在不确定用户是否需要高级功能之前，先交付最小可用版本。如果未来数据量过万或用户反馈"搜不到"，我们再加后端搜索。

  **交付标准：**
  输入"张"能看到所有姓张的员工，清空搜索框恢复全列表。就这些。

hints:
  - "用户的原始需求是什么？agent 是不是在解决一个不存在的问题？"
  - "500 条数据需要 Elasticsearch 吗？"
  - "怎么让 agent 知道边界在哪，而不是'随便加'？"
