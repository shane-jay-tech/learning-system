title: "评估子任务的优先级和工作量"
topic: "09_decompose"
difficulty: 3
tags: ["decompose", "priority", "ai_judge"]
judge_mode: ai_open
statement: |
  **场景**：你拆好了一个「用户通知系统」的子任务清单：
  1. 设计通知数据表
  2. 写通知发送 API
  3. 前端通知铃铛图标 + 下拉列表
  4. 邮件通知集成（SendGrid）
  5. 通知已读/未读标记
  6. 通知偏好设置页面

  假设你只有 2 天时间，请：
  - 标出哪些是 MVP 必做的（day 1-2 必须完成）
  - 哪些可以延后
  - 给出理由
starter_code: ""
rubric:
  - "合理区分了 MVP 和延后项（1/2/3/5 是核心，4/6 可延后）"
  - "给出了排序理由（如：没有数据表其他都做不了 → 1 最先）"
  - "考虑了依赖关系对优先级的影响"
reference_answer: |
  MVP（2 天内必做）:
  1. 通知数据表 → 所有后续都依赖它，最先做
  2. 发送 API → 有了接口才能在前端展示
  3. 前端铃铛 → 用户能看到通知，MVP 可用
  5. 已读标记 → 不标记的话铃铛永远显示新消息，体验很差

  延后:
  4. 邮件通知 → 锦上添花，用户打开 App 就能看到站内通知
  6. 偏好设置 → 初版先全推，有用户反馈"太吵"再加

  理由: MVP = 最小可用闭环（能发、能看、能消）
hints:
  - "MVP 的判断标准：如果没有这个功能，用户连基本流程都走不通。"
