title: "把密钥写死在代码里，危险在哪？"
topic: "07_data_security"
difficulty: 3
tags: ["security", "secrets", "open", "ai_judge"]
judge_mode: ai_open
statement: |
  你看到一段代码这样写：

  ```python
  import openai
  openai.api_key = "sk-proj-abc123realkey456"   # 直接写在代码里
  client = connect_db(password="MyP@ssw0rd")
  ```

  请回答：
  1. 这样写有哪些**泄露的途径**？（想想这份代码会去哪些地方）
  2. **正确的做法**是什么？

  用你自己的话答，不用写完整代码。
starter_code: ""
rubric:
  - "泄露途径：至少说出 2 种——提交到 Git 仓库被人看到 / 写进日志 / 把代码文件发给别人或 AI / 截图分享"
  - "正确做法：指出应放到环境变量或 .env 文件读取，而不是写死在代码里"
  - "加分：提到 .env 要加入 .gitignore 不进版本库 / 密钥一旦泄露要立即轮换作废"
  - "理解核心：代码会被分享/提交/留痕，而密钥一旦进了这些地方就收不回来"
reference_answer: |
  1. **泄露途径**：
     - 提交到 Git 后，任何能看到仓库的人（甚至历史记录里）都拿到了密钥；
     - 程序出错时密钥可能被打进日志文件；
     - 你把这个 .py 发给同事、贴到群里、或丢给 AI 帮忙看代码时，密钥就跟着走了；
     - 截图、录屏也会带出来。
  2. **正确做法**：密钥不写进代码，放到环境变量或 `.env` 文件里，代码用 `os.getenv("OPENAI_API_KEY")` 读取；`.env` 加进 `.gitignore` 不提交。万一密钥已经泄露，第一时间去后台**作废旧密钥、换新的**（轮换），因为泄露的密钥收不回来。
hints:
  - "想想这份代码文件接下来会去哪：提交、分享、出错打日志……"
  - "密钥不该和代码绑在一起——它应该来自'代码之外'的地方。"
  - "已经泄露的密钥，删掉代码也没用，为什么？"
