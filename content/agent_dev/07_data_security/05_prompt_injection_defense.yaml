title: "Prompt 注入防御：输入过滤与输出校验"
topic: "07_data_security"
difficulty: 4
tags: ["security", "prompt_injection", "defense"]
judge_mode: ai_open
statement: |
  Agent 系统的 prompt 注入防御。
  场景：用户在输入中嵌入指令试图劫持 Agent。
  请写出三层防御策略并给出关键代码。
starter_code: |
  # 三层防御
hints:
  - "三层可以按位置想：输入层（过滤/转义）、模型层（system prompt 硬约束）、输出层（动作白名单校验）"
  - "输入层关键词：指令模式检测、角色分隔符、不可信内容打标"
  - "输出层关键词：工具调用白名单、敏感动作二次确认、最小权限"
rubric:
  - "三层防御结构完整：输入过滤、模型层约束、输出校验缺一不可"
  - "输入层给出可操作手段（指令模式检测/不可信内容打标/角色分隔），不是只喊口号"
  - "输出层体现最小权限：工具白名单、敏感动作二次确认"
  - "能举出一个具体注入样例并说明每层如何拦截"
