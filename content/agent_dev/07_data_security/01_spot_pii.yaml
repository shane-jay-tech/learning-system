title: "哪些字段是 PII？"
topic: "07_data_security"
difficulty: 2
tags: ["security", "pii", "open", "ai_judge"]
judge_mode: ai_open
statement: |
  你收到一份员工心理健康调查表，字段有：

  `姓名、手机号、部门、出生日期、邮编、性别、压力评分(1-10)、提交时间`

  请回答：
  1. 哪些字段是**直接能认出是谁**的（直接标识）？
  2. 哪些字段单看不认人、但**组合起来**可能锁定一个人（准标识）？
  3. 如果你只是想分析"各部门的平均压力水平"，哪些字段其实**根本不用收**？

  用你自己的话分点答。
starter_code: ""
rubric:
  - "直接标识：正确点出 姓名、手机号（能直接定位个人）"
  - "准标识：指出 出生日期 + 邮编 + 性别 组合起来可能唯一锁定一个人"
  - "数据最小化：意识到分析部门平均压力只需要 部门 + 压力评分，姓名/手机/出生日期等都不必收"
  - "有体现'收得越少、泄露风险越小'的最小化意识"
reference_answer: |
  1. **直接标识**：姓名、手机号——单独一个就能认出是谁。
  2. **准标识**：出生日期、邮编、性别。任何一个单看不认人，但三者组合常能在一个部门里唯一定位某人（比如"研发部、1995-03-12、男、邮编 100085"很可能只对应一个人）。
  3. **根本不用收**：要算各部门平均压力，只需要「部门 + 压力评分」两列。姓名、手机号、出生日期、邮编、性别全都不必收——这就是"数据最小化"：能不收就不收，泄露风险随之降到最低。
hints:
  - "先问：哪个字段单独拿出来就能认出人？"
  - "再问：哪些字段单看普通、但拼在一起能缩小到一个人？"
  - "最后问：我的分析目标其实只需要哪几列？多余的就是负担。"
