title: "换成「员工001」就算脱敏了吗？"
topic: "07_data_security"
difficulty: 3
tags: ["security", "anonymization", "open", "ai_judge"]
judge_mode: ai_open
statement: |
  同事说："我把调查表里的姓名都换成了 `员工001`、`员工002`，
  现在数据脱敏了，可以放心分享了。"

  但他**另外存了一张对照表**：`员工001 = 张三`。

  请回答：
  1. 他做的这个叫**假名化**还是**匿名化**？这份数据现在还算 PII 吗？为什么？
  2. 要做到**真正匿名化**（没人能还原是谁），应该怎么做？

  用你自己的话答。
starter_code: ""
rubric:
  - "正确区分：指出这是『假名化』，因为存在对照表，能还原回真人"
  - "判断正确：只要对照表存在，数据仍属于 PII，不能当作已脱敏随意分享"
  - "真正匿名化的做法：彻底删除标识符和对照表 / 聚合到组层面（如只保留部门统计）/ 确保无法反推到个人"
  - "理解核心：能不能还原，是假名化和匿名化的分水岭"
reference_answer: |
  1. 这是**假名化**，不是匿名化。因为那张对照表还在，任何拿到对照表的人都能把 `员工001` 还原成张三。所以这份数据**仍然是 PII**，不能当成"已脱敏"随便分享——风险只是被那张对照表挡了一下。
  2. 要**真正匿名化**：
     - 彻底删除姓名等标识符，并**销毁对照表**（不再保留任何能还原的映射）；
     - 更稳的做法是**聚合**——只保留组层面的结果，比如"研发部平均压力 6.2、共 30 人"，不再留任何个人行；
     - 还要注意准标识符（出生日期+邮编+性别）也可能反推个人，必要时做粗化（只留出生年份、只留城市）。
     - 判断标准始终是一句话：**还有没有人、用任何手段能还原到具体某个人？**
hints:
  - "关键问题：那张对照表在，能不能还原回真人？"
  - "假名化 = 还能还原；匿名化 = 谁都还原不了。"
  - "最稳的匿名化往往是'聚合'——只看组、不看人。"
