title: "场景：这个数据该不该收？"
topic: "07_data_security"
difficulty: 4
tags: ["security", "minimization", "open", "ai_judge"]
judge_mode: ai_open
statement: |
  你要做一个工具，分析**公司各部门的心理压力水平**，帮 HR 决定哪个部门需要支持。

  产品经理说："顺便把每个人的**姓名、工号、具体压力分**都存下来吧，
  万一以后想看某个人的情况呢。"

  请你从**数据安全/隐私**角度回应这个要求：
  1. 这个"顺便存着"的要求有什么风险？
  2. 你会怎么设计才既满足分析目标、又把风险降到最低？
  3. 如果 HR 坚持要"能看到个人"，你会加什么保护措施？

  用你自己的话答，体现权衡。
starter_code: ""
rubric:
  - "识别风险：'以后可能用得上'是典型的过度收集，存的个人数据越多、越久，泄露和滥用风险越大"
  - "最小化设计：分析部门压力只需聚合数据（部门 + 平均分 + 人数），默认不存个人原始记录"
  - "权衡而非教条：能就事论事回应——若确有个案跟进需求，给出受控方案（假名化、访问权限、知情同意、保留期限），而不是简单说'不行'"
  - "至少提到一项具体保护：访问控制/最小权限、加密存储、设定保留期限到期删除、员工知情同意"
reference_answer: |
  1. **风险**：「以后可能用得上」是典型的过度收集。把姓名+工号+个人压力分长期存着，等于凭空造了一个高敏感数据库——一旦泄露，伤的是真实员工，而且"个人心理压力"属于特别敏感信息，滥用还可能影响员工的职业处境。
  2. **最小化设计**：分析部门压力，默认**只存聚合结果**（部门、平均分、样本数），原始个人作答在算完后就不再保留，或只在本地临时处理、不入库。这样既能回答"哪个部门需要支持"，又不留个人档案。
  3. **如果 HR 坚持要看到个人**：不一刀切拒绝，但加保护——
     - **知情同意**：收集前明确告诉员工数据会被怎么用；
     - **假名化 + 访问控制**：用工号代替姓名，对照表单独存、只有授权的人能访问（最小权限）；
     - **加密存储**；
     - **保留期限**：设定到期自动删除，不无限期留着；
     - 记录"谁在什么时候看了个人数据"。
  核心是：**默认最小化，个案跟进是例外且受控**，而不是反过来。
hints:
  - "'万一以后用得上'是危险信号——存着的代价是什么？"
  - "先问：达成分析目标，最少需要什么数据？"
  - "不是非黑即白——如果真要看个人，怎么在'可用'和'安全'之间加保护？"
